name: deploy

# Continuous deploy to production (Hetzner / uptimepage.dev).
#
# Deploys are non-destructive: this workflow never drops a database or a data
# volume, and it carries no input that would. Migrations are forward-only, so a
# migration that is wrong once applied is fixed by a new migration. Editing an
# applied one crash-loops the boot with no path back through here.
#
# Two ways in:
#   • automatic — chains off a successful `release-image` build on main, and
#     only proceeds if the branch-push `ci` run is ALSO green for the same
#     commit (enforced in the "ci gate" step). Pins the remote working tree AND
#     the image to that commit's sha.
#   • manual — `workflow_dispatch`: pick any image tag. Manual runs skip the ci
#     gate (human asserts it).
#
# Required repo secrets (Settings → Secrets → Actions; none committed):
#   DEPLOY_SSH_KEY      private key for the deploy@ user (the gitignored
#                       `hetzner` key — its contents, never committed)
#   DEPLOY_HOST         deploy host (IP or DNS)
#   DEPLOY_USER         ssh user (deploy)
#   DEPLOY_KNOWN_HOSTS  pinned host key line(s) from `ssh-keyscan <host>`
#                       — pins the server identity so the run cannot be MITM'd
#                       (no StrictHostKeyChecking=off anywhere below)
#
# Optional repo secrets — each group is upserted into the server .env
# only when its values are all set; unset = that signal stays off.
# One access-policy token (GRAFANA_CLOUD_API_TOKEN) backs all three
# signals — it just needs the matching scopes (metrics:write +
# traces:write + logs:write) on the policy.
#   Metrics (Alloy sidecar → Grafana Cloud Prometheus):
#     GRAFANA_CLOUD_PROM_URL    remote_write endpoint
#     GRAFANA_CLOUD_PROM_USER   Prometheus numeric instance id
#     GRAFANA_CLOUD_API_TOKEN   access-policy token (sensitive)
#   Traces (in-app OTLP/HTTP → Grafana Cloud Tempo):
#     GRAFANA_OTLP_ENDPOINT     OTLP gateway base url
#     GRAFANA_OTLP_INSTANCE_ID  OTLP numeric instance id (≠ Prom id)
#     GRAFANA_OTLP_API_TOKEN    access-policy token (sensitive)
#   Logs (Alloy sidecar → Grafana Cloud Loki; rides the metrics sidecar):
#     GRAFANA_CLOUD_LOKI_URL    Loki push endpoint
#     GRAFANA_CLOUD_LOKI_USER   Loki numeric instance id (≠ Prom id)
#     (token: reuses GRAFANA_CLOUD_API_TOKEN, needs logs:write)
#   Deploy annotation (best-effort marker on Grafana dashboards):
#     GRAFANA_ANNOTATIONS_URL   https://<stack>.grafana.net/api/annotations
#     GRAFANA_ANNOTATIONS_TOKEN Grafana service-account token with the
#                               annotations:write role (NOT a glc_ token)
#   Central Telegram bot (one-tap channel linking; group is all-or-nothing):
#     TELEGRAM_BOT_TOKEN        BotFather token (sensitive)
#     TELEGRAM_WEBHOOK_SECRET   random 32+ chars, echoed back by Telegram
#                               on every webhook delivery (sensitive)
#   Provider OAuth connect buttons (each pair all-or-nothing):
#     SLACK_OAUTH_CLIENT_ID       operator Slack app client id
#     SLACK_OAUTH_CLIENT_SECRET   operator Slack app client secret (sensitive)
#     DISCORD_OAUTH_CLIENT_ID     operator Discord app client id
#     DISCORD_OAUTH_CLIENT_SECRET operator Discord app client secret (sensitive)
#   Google OAuth login (pair all-or-nothing; the redirect URL is managed
#   manually in the server .env like the GitHub login trio):
#     GOOGLE_OAUTH_CLIENT_ID      Google Cloud OAuth web client id
#     GOOGLE_OAUTH_CLIENT_SECRET  Google Cloud OAuth client secret (sensitive)
#     MICROSOFT_OAUTH_CLIENT_ID     Entra app registration (application) id
#     MICROSOFT_OAUTH_CLIENT_SECRET Entra client secret value (sensitive, expires)
#     GITLAB_OAUTH_CLIENT_ID        GitLab application id
#     GITLAB_OAUTH_CLIENT_SECRET    GitLab application secret (sensitive)
#   Operator WhatsApp number (one-tap linking; sextet all-or-nothing,
#   enable flag separate — sends are operator-paid):
#     WHATSAPP_APP_ACCESS_TOKEN    Meta Cloud API token (sensitive)
#     WHATSAPP_APP_PHONE_NUMBER_ID Cloud API phone-number id
#     WHATSAPP_APP_PUBLIC_NUMBER   display number, international digits
#     WHATSAPP_APP_SECRET          Meta app secret, signs webhooks (sensitive)
#     WHATSAPP_APP_VERIFY_TOKEN    random 32+ chars for the GET handshake (sensitive)
#     WHATSAPP_APP_TEMPLATE_NAME   approved alert template name
#   Repo var WHATSAPP_APP_ENABLED ("true") flips the spend gate — creds
#   alone keep the surface off.
#   Transactional mail (Resend; the key and the EMAIL_FROM_ADDRESS repo
#   variable below are all-or-nothing, the secret is optional):
#     RESEND_API_KEY            re_… API key — presence flips the provider
#                               from "log" to "resend" (sensitive)
#     RESEND_WEBHOOK_SECRET     whsec_… Svix signing secret of the Resend
#                               webhook endpoint; presence mounts the
#                               /hooks/resend bounce receiver (sensitive)
# Non-secret repo variables: RUST_LOG (log/trace verbosity),
# TELEGRAM_BOT_USERNAME (the bot's public @handle, no leading @),
# EMAIL_FROM_ADDRESS (verified sender on a read inbox, e.g. hello@<domain>;
# a no-reply address turns every reply into a bounce or a spam report;
# written together with RESEND_API_KEY, so it needs that secret to land),
# EMAIL_SUPPORT_ADDRESS (inbox behind the in-app /help form; unset = no
# form) — redeploy applies them with no rebuild.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-<full40>, v1.2.3, latest)"
        required: true
        type: string
  workflow_run:
    workflows: [release-image]
    types: [completed]
    branches: [main]

# One deploy at a time — never let two runs race on the box / .env.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Manual runs always proceed; auto runs only when the image build that
    # triggered us actually succeeded (the ci-green gate is the next step).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read # authenticated git fetch on the box (see deploy step)
      actions: read # read ci.yml run conclusion for the gate
      packages: read # authenticated GHCR pull (higher rate limit than anonymous)
    environment: production # attach required-reviewer / protection rules via the GitHub env
    env:
      # Auto path: deploy the exact commit that was built. Manual path:
      # operator-chosen tag.
      IMAGE_TAG: ${{ inputs.image_tag || format('sha-{0}', github.event.workflow_run.head_sha) }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      # Single source of truth, mirrored from release-image.yml.
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: ci gate
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "$HEAD_SHA" ] || { echo "::error::empty head_sha on auto path"; exit 1; }
          # Assert the branch-PUSH ci run (the same event release-image gates
          # on) is green for this exact commit — event=push so a weaker
          # pull_request / dispatch ci run can't satisfy the gate. ci (~5-9m)
          # normally concludes before release-image (~12-14m), so this usually
          # passes on the first probe; poll a few times for a ci tail-run.
          for i in $(seq 1 12); do
            c=$(gh api \
              "repos/${IMAGE_NAME}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&branch=main&event=push&per_page=1" \
              --jq '.workflow_runs[0] | (.status + ":" + (.conclusion // "null"))' 2>/dev/null || echo "none:null")
            case "$c" in
              completed:success) echo "ci green for ${HEAD_SHA}"; exit 0 ;;
              completed:*)       echo "::error::ci not green for ${HEAD_SHA} (${c}) — blocking autodeploy"; exit 1 ;;
              *)                 echo "ci not concluded yet (${c}); waiting…"; [ "$i" -lt 12 ] && sleep 30 ;;
            esac
          done
          echo "::error::ci did not conclude for ${HEAD_SHA} within ~6m — blocking autodeploy"
          exit 1

      - name: validate image tag
        run: |
          set -euo pipefail
          # The classic footgun: a SHORT git sha as image_tag. The .env
          # image bump would write a tag GHCR never published; the pull
          # 404s and the deploy aborts AFTER .env was already rewritten,
          # leaving the box unable to recreate the app until that line is
          # hand-fixed. release-image only ever publishes the full 40-hex
          # sha-<40>. Non-sha tags (semver, latest) are unconstrained and
          # pass through. The auto path's sha-<head_sha> is full-length,
          # so this also fails closed if a runner ever yields a short sha.
          [ -n "$IMAGE_TAG" ] || { echo "::error::image_tag resolved empty"; exit 1; }
          case "$IMAGE_TAG" in
            sha-*)
              if ! printf '%s' "${IMAGE_TAG#sha-}" | grep -qiE '^[0-9a-f]{40}$'; then
                echo "::error::image_tag '$IMAGE_TAG' is a short/invalid sha — it must be sha-<full 40-hex commit sha> (release-image publishes only that tag). Re-dispatch with the full sha."
                exit 1
              fi
              ;;
          esac
          echo "image tag ok: $IMAGE_TAG"

      - name: load ssh key + pinned host key
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_deploy <<< "${{ secrets.DEPLOY_SSH_KEY }}"
          install -m 600 /dev/stdin ~/.ssh/known_hosts <<< "${{ secrets.DEPLOY_KNOWN_HOSTS }}"

      - name: deploy over ssh
        # All ${{ }} live here, never inline in the run block below: GitHub caps
        # an expression-bearing string at 21000 chars and this block is large,
        # so an inline ${{ }} makes the whole script one over-long expression and
        # the file fails to parse. As $ENV refs the block stays expression-free.
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRAFANA_CLOUD_PROM_URL: ${{ secrets.GRAFANA_CLOUD_PROM_URL }}
          GRAFANA_CLOUD_PROM_USER: ${{ secrets.GRAFANA_CLOUD_PROM_USER }}
          GRAFANA_CLOUD_API_TOKEN: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
          GRAFANA_OTLP_ENDPOINT: ${{ secrets.GRAFANA_OTLP_ENDPOINT }}
          GRAFANA_OTLP_INSTANCE_ID: ${{ secrets.GRAFANA_OTLP_INSTANCE_ID }}
          GRAFANA_OTLP_API_TOKEN: ${{ secrets.GRAFANA_OTLP_API_TOKEN }}
          GRAFANA_CLOUD_LOKI_URL: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USER: ${{ secrets.GRAFANA_CLOUD_LOKI_USER }}
          RUST_LOG: ${{ vars.RUST_LOG }}
          UPTIMEPAGE_MCP_ENABLED: ${{ vars.MCP_ENABLED }}
          UPTIMEPAGE_MCP_OAUTH_ENABLED: ${{ vars.MCP_OAUTH_ENABLED }}
          # Secret, not a variable — the URL carries a capability token.
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          # Operator admin bearer — enables the cross-tenant /operator surface.
          OPERATOR_ADMIN_TOKEN: ${{ secrets.OPERATOR_ADMIN_TOKEN }}
          # Central Telegram bot — token presence enables one-tap linking.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          # Operator OAuth apps — presence enables the connect buttons.
          SLACK_OAUTH_CLIENT_ID: ${{ secrets.SLACK_OAUTH_CLIENT_ID }}
          SLACK_OAUTH_CLIENT_SECRET: ${{ secrets.SLACK_OAUTH_CLIENT_SECRET }}
          DISCORD_OAUTH_CLIENT_ID: ${{ secrets.DISCORD_OAUTH_CLIENT_ID }}
          DISCORD_OAUTH_CLIENT_SECRET: ${{ secrets.DISCORD_OAUTH_CLIENT_SECRET }}
          # Google OAuth login — presence enables the login button.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_SECRET: ${{ secrets.MICROSOFT_OAUTH_CLIENT_SECRET }}
          GITLAB_OAUTH_CLIENT_ID: ${{ secrets.GITLAB_OAUTH_CLIENT_ID }}
          GITLAB_OAUTH_CLIENT_SECRET: ${{ secrets.GITLAB_OAUTH_CLIENT_SECRET }}
          # Operator WhatsApp number — creds via secrets, spend gate via var.
          WHATSAPP_APP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_APP_ACCESS_TOKEN }}
          WHATSAPP_APP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_APP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_PUBLIC_NUMBER: ${{ secrets.WHATSAPP_APP_PUBLIC_NUMBER }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_APP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_APP_VERIFY_TOKEN }}
          WHATSAPP_APP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_APP_TEMPLATE_NAME }}
          WHATSAPP_APP_ENABLED: ${{ vars.WHATSAPP_APP_ENABLED }}
          # Transactional mail — key presence flips provider log → resend.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          EMAIL_SUPPORT_ADDRESS: ${{ vars.EMAIL_SUPPORT_ADDRESS }}
          # Dashboard/agent split. Token is a secret (agent credential); the
          # three knobs are plain config (Actions variables). Set all three vars
          # + the token to switch prod to brain-only + a co-located agent (see
          # deployment/AGENT.md). All absent = unchanged all-in-one.
          HOME_AGENT_TOKEN: ${{ secrets.HOME_AGENT_TOKEN }}
          # allow / flag / block — see docs/configuration.md. Absent = unchanged.
          UPTIMEPAGE_EMAIL_POLICY_ENABLED: ${{ vars.UPTIMEPAGE_EMAIL_POLICY_ENABLED }}
          UPTIMEPAGE_EMAIL_POLICY_SIGNUP_POLICY: ${{ vars.UPTIMEPAGE_EMAIL_POLICY_SIGNUP_POLICY }}
          UPTIMEPAGE_SCHEDULER_ENABLED: ${{ vars.UPTIMEPAGE_SCHEDULER_ENABLED }}
          UPTIMEPAGE_SCHEDULER_REGION: ${{ vars.UPTIMEPAGE_SCHEDULER_REGION }}
          UPTIMEPAGE_SCHEDULER_DEFAULT_REGION: ${{ vars.UPTIMEPAGE_SCHEDULER_DEFAULT_REGION }}
          # Flips browser-flow probing on the co-located agent (compose gates the
          # agent's UPTIMEPAGE_FLOW__ENABLED on it). Absent = stays off.
          AGENT_FLOW_ENABLED: ${{ vars.AGENT_FLOW_ENABLED }}
        run: |
          set -euo pipefail
          # Lowercase only the repo (GHCR requires it); OCI tags are
          # case-sensitive so the tag is passed through verbatim.
          NEW_IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]'):${IMAGE_TAG}"
          # Grafana Cloud creds (optional). Inlined into the remote command
          # env like NEW_IMAGE — GitHub masks registered secret values in
          # the run log; no `set -x` is enabled around them. Unset secrets
          # pass through as empty and the remote skips the matching block.
          # Independent signals: the metrics trio + Loki pair drive the
          # Alloy sidecar; the OTLP trio drives in-app trace export.
          # Tokens are written to the server .env (same trust tier as the
          # KEK already there), never committed.
          ssh -T -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "NEW_IMAGE='${NEW_IMAGE}' HEAD_SHA='${HEAD_SHA}' \
               GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' \
               IMAGE_NAME='${IMAGE_NAME}' \
               GRAFANA_CLOUD_PROM_URL='${GRAFANA_CLOUD_PROM_URL}' \
               GRAFANA_CLOUD_PROM_USER='${GRAFANA_CLOUD_PROM_USER}' \
               GRAFANA_CLOUD_API_TOKEN='${GRAFANA_CLOUD_API_TOKEN}' \
               GRAFANA_OTLP_ENDPOINT='${GRAFANA_OTLP_ENDPOINT}' \
               GRAFANA_OTLP_INSTANCE_ID='${GRAFANA_OTLP_INSTANCE_ID}' \
               GRAFANA_OTLP_API_TOKEN='${GRAFANA_OTLP_API_TOKEN}' \
               GRAFANA_CLOUD_LOKI_URL='${GRAFANA_CLOUD_LOKI_URL}' \
               GRAFANA_CLOUD_LOKI_USER='${GRAFANA_CLOUD_LOKI_USER}' \
               RUST_LOG='${RUST_LOG}' \
               UPTIMEPAGE_MCP_ENABLED='${UPTIMEPAGE_MCP_ENABLED}' \
               UPTIMEPAGE_MCP_OAUTH_ENABLED='${UPTIMEPAGE_MCP_OAUTH_ENABLED}' \
               HEARTBEAT_URL='${HEARTBEAT_URL}' \
               OPERATOR_ADMIN_TOKEN='${OPERATOR_ADMIN_TOKEN}' \
               TELEGRAM_BOT_TOKEN='${TELEGRAM_BOT_TOKEN}' \
               TELEGRAM_WEBHOOK_SECRET='${TELEGRAM_WEBHOOK_SECRET}' \
               TELEGRAM_BOT_USERNAME='${TELEGRAM_BOT_USERNAME}' \
               SLACK_OAUTH_CLIENT_ID='${SLACK_OAUTH_CLIENT_ID}' \
               SLACK_OAUTH_CLIENT_SECRET='${SLACK_OAUTH_CLIENT_SECRET}' \
               DISCORD_OAUTH_CLIENT_ID='${DISCORD_OAUTH_CLIENT_ID}' \
               DISCORD_OAUTH_CLIENT_SECRET='${DISCORD_OAUTH_CLIENT_SECRET}' \
               GOOGLE_OAUTH_CLIENT_ID='${GOOGLE_OAUTH_CLIENT_ID}' \
               GOOGLE_OAUTH_CLIENT_SECRET='${GOOGLE_OAUTH_CLIENT_SECRET}' \
               MICROSOFT_OAUTH_CLIENT_ID='${MICROSOFT_OAUTH_CLIENT_ID}' \
               MICROSOFT_OAUTH_CLIENT_SECRET='${MICROSOFT_OAUTH_CLIENT_SECRET}' \
               GITLAB_OAUTH_CLIENT_ID='${GITLAB_OAUTH_CLIENT_ID}' \
               GITLAB_OAUTH_CLIENT_SECRET='${GITLAB_OAUTH_CLIENT_SECRET}' \
               WHATSAPP_APP_ACCESS_TOKEN='${WHATSAPP_APP_ACCESS_TOKEN}' \
               WHATSAPP_APP_PHONE_NUMBER_ID='${WHATSAPP_APP_PHONE_NUMBER_ID}' \
               WHATSAPP_APP_PUBLIC_NUMBER='${WHATSAPP_APP_PUBLIC_NUMBER}' \
               WHATSAPP_APP_SECRET='${WHATSAPP_APP_SECRET}' \
               WHATSAPP_APP_VERIFY_TOKEN='${WHATSAPP_APP_VERIFY_TOKEN}' \
               WHATSAPP_APP_TEMPLATE_NAME='${WHATSAPP_APP_TEMPLATE_NAME}' \
               WHATSAPP_APP_ENABLED='${WHATSAPP_APP_ENABLED}' \
               RESEND_API_KEY='${RESEND_API_KEY}' \
               RESEND_WEBHOOK_SECRET='${RESEND_WEBHOOK_SECRET}' \
               EMAIL_FROM_ADDRESS='${EMAIL_FROM_ADDRESS}' \
               EMAIL_SUPPORT_ADDRESS='${EMAIL_SUPPORT_ADDRESS}' \
               HOME_AGENT_TOKEN='${HOME_AGENT_TOKEN}' \
               UPTIMEPAGE_EMAIL_POLICY_ENABLED='${UPTIMEPAGE_EMAIL_POLICY_ENABLED}' \
               UPTIMEPAGE_EMAIL_POLICY_SIGNUP_POLICY='${UPTIMEPAGE_EMAIL_POLICY_SIGNUP_POLICY}' \
               UPTIMEPAGE_SCHEDULER_ENABLED='${UPTIMEPAGE_SCHEDULER_ENABLED}' \
               UPTIMEPAGE_SCHEDULER_REGION='${UPTIMEPAGE_SCHEDULER_REGION}' \
               UPTIMEPAGE_SCHEDULER_DEFAULT_REGION='${UPTIMEPAGE_SCHEDULER_DEFAULT_REGION}' \
               AGENT_FLOW_ENABLED='${AGENT_FLOW_ENABLED}' \
               bash -s" <<'REMOTE'
          # This script is delivered to `bash -s` over the ssh heredoc — i.e. on
          # stdin (fd 0). A `docker compose exec -T` / `docker exec -i` / nested
          # `ssh` run directly would inherit fd 0 and drain the rest of the
          # script as its own stdin, silently skipping every later command (the
          # Caddy reload, the port-binding security check) while still exiting 0.
          # Slurp the remaining body to a temp file and run THAT with stdin
          # pinned to /dev/null, so no child can ever consume the script body —
          # the whole drain class is gone, no per-command `</dev/null` needed.
          __body=$(mktemp) || exit 1; trap 'rm -f "$__body"' EXIT; cat >"$__body" || exit 1; bash "$__body" </dev/null; exit $?

          set -euo pipefail
          # Every file written during this script (including .env, .env.next,
          # .env.bak.*, sparse-checkout overrides) must be owner-only. Fresh
          # Hetzner box defaults umask 0022 → secrets land world-readable.
          umask 077

          cd /opt/uptimepage
          # GitHub 401s anonymous git-over-HTTPS from this box: its May 2025
          # unauthenticated-traffic limits took clone/fetch in scope. Send the
          # credential up front, scoped to github.com — a credential helper
          # would stay dormant, git consults one only after a 401.
          if [ -z "${IMAGE_NAME:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
            echo "::error::IMAGE_NAME/GHCR_TOKEN did not reach the box — check the ssh env prefix"
            exit 1
          fi
          git_basic=$(printf 'x-access-token:%s' "$GHCR_TOKEN" | base64 -w0)
          # Actions masks the raw secret, not this encoding of it.
          echo "::add-mask::$git_basic"
          # A box still carrying a pre-transfer origin fails here, and nothing
          # on it self-heals.
          origin_url="https://github.com/${IMAGE_NAME}.git"
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$origin_url"
          else
            git remote add origin "$origin_url"
          fi
          # Slot 0 is the documented reset: extraheader accumulates across every
          # config scope, and github.com rejects two Authorization headers.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0=''
          export GIT_CONFIG_KEY_1='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic ${git_basic}"
          if [ -n "$HEAD_SHA" ]; then
            # Auto path: pin the working tree to the exact built commit so the
            # on-disk compose/.env/migrations match the image. A later push
            # landing on main mid-build must NOT skew this deploy.
            git fetch --quiet origin "$HEAD_SHA"
            git checkout --quiet --force "$HEAD_SHA"
          else
            # Manual path: operator-chosen tag, tree stays at tip of main.
            # Rollback is code-only (see rollback.yml) and an older tree would
            # roll the postgres/clickhouse pins under a live volume. Named refs
            # because the auto path leaves HEAD detached, where a bare `git
            # pull` refuses to guess a branch; FETCH_HEAD because a hand-set
            # remote.origin.fetch cannot redirect it.
            git fetch --quiet origin main
            # --force lost --ff-only's other job: refusing a non-descendant.
            git merge-base --is-ancestor HEAD FETCH_HEAD || {
              echo "::error::main is not a fast-forward of the deployed tree — refusing to move it backward"
              exit 1
            }
            git checkout --quiet --force FETCH_HEAD
          fi
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 \
                GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1
          echo "tree at $(git rev-parse HEAD)"

          # Ship only prod artifacts to the box. Pre-this, `git pull` landed
          # the entire repo on /opt/uptimepage/, including root
          # docker-compose.yml + compose.dev.yml that bind DBs to 0.0.0.0
          # with default creds — one wrong `cd` + bare `docker compose up`
          # = publicly exposed databases. `reapply` prunes anything outside
          # the allowlist.
          #
          # Critical ordering: `git sparse-checkout init` IMMEDIATELY prunes
          # the working tree to its default pattern (cone-mode `/*` + `!/*/`
          # = root files only, deletes all subdirs incl. `deployment/`). So
          # the allowlist must be read from git objects (`git show HEAD:…`)
          # BEFORE init — reading from the working tree races with the prune.
          # Earlier draft of this block did `cp deployment/sparse-checkout.list`
          # AFTER init and failed with "No such file or directory" on first
          # deploy.
          if ! git show "HEAD:deployment/sparse-checkout.list" > /tmp/sc.list 2>/dev/null; then
            echo "::error::deployment/sparse-checkout.list missing in HEAD — refusing to deploy"
            exit 1
          fi
          git sparse-checkout init --no-cone
          cp /tmp/sc.list .git/info/sparse-checkout
          git sparse-checkout reapply
          rm -f /tmp/sc.list

          cd deployment

          # --- bind-mounted config: re-assert mode + heal stale mounts -------
          # `git checkout`/`sparse-checkout reapply` above recreate these
          # files under this script's `umask 077` → 0600. The containers run
          # as non-root (ClickHouse UID 101, Postgres UID 70) and can't read
          # 0600 host files, so they boot-loop ("Access to file denied" for
          # CH; "could not open configuration file … Permission denied" for
          # PG started with config_file=). Re-assert 0644 on EVERY deploy (the
          # old chmod only ran on the volume-drop path, so normal deploys
          # silently left them 0600).
          chmod 644 clickhouse-config.xml clickhouse-users.xml postgresql.conf 2>/dev/null || true
          # Fail loud if the mode didn't take (immutable bit, ACL, odd FS) —
          # a 0600 here is the silent multi-day boot loop we just had.
          for f in clickhouse-config.xml clickhouse-users.xml postgresql.conf; do
            mode=$(stat -c '%a' "$f" 2>/dev/null || echo "missing")
            if [ "$mode" != "644" ]; then
              echo "::error::${f} must be mode 644 for its container to read it; got ${mode}"
              exit 1
            fi
          done

          # Single-file bind mounts pin the inode at container-create time:
          # a rewritten (new-inode) config is invisible to the running CH, and
          # a plain `restart` re-reads the same stale inode. Hash host vs
          # in-container and force-recreate CH only on drift (same pattern as
          # the Caddyfile block below). Must run BEFORE the readyz gate, which
          # probes from the CH container and would hang if CH were looping.
          ch_recreate=""
          for pair in \
            "clickhouse-config.xml:/etc/clickhouse-server/config.d/custom.xml" \
            "clickhouse-users.xml:/etc/clickhouse-server/users.d/zz-default-password.xml"; do
            hf="${pair%%:*}"; cf="${pair#*:}"
            host_h=$(sha256sum "$hf" 2>/dev/null | awk '{print $1}')
            if ctr_line=$(docker compose exec -T clickhouse sha256sum "$cf" 2>/dev/null); then
              ctr_h=$(printf '%s' "$ctr_line" | awk '{print $1}')
            else
              ctr_h=""   # CH down/unreadable → force a recreate (safe default)
            fi
            if [ -z "$host_h" ] || [ "$host_h" != "$ctr_h" ]; then
              echo "CH config drift on ${hf} (host=${host_h:0:12} ctr=${ctr_h:0:12})"
              ch_recreate=1
            fi
          done
          if [ -n "$ch_recreate" ]; then
            echo "recreating clickhouse to re-resolve bind mounts to current inodes"
            docker compose up -d --no-build --force-recreate clickhouse
          fi

          # --- pick the blue/green target color -----------------------------
          # Steady state runs exactly one app color; deploy the OTHER, then
          # stop the previous one. The running color is the source of truth
          # (.active_color is only a hint); a box where neither is up (fresh
          # bring-up / full recreate) defaults to blue.
          active=""
          if docker compose ps --services --status running 2>/dev/null | grep -qx uptimepage_blue; then
            active="blue"
          elif docker compose ps --services --status running 2>/dev/null | grep -qx uptimepage_green; then
            active="green"
          fi
          case "$active" in
            blue)  target="green" ;;
            green) target="blue"  ;;
            *)     target="blue"  ;;
          esac
          TARGET_SVC="uptimepage_${target}"
          echo "active color: ${active:-none}; deploying to: ${target}"

          # --- bump UPTIMEPAGE_IMAGE in .env -----------------------------
          # cp backup FIRST; awk in-place rewrite (every line is reprinted, only
          # the target key is substituted — never grep -v | append | mv); then
          # verify the line count is unchanged and the key carries the new value.
          cp .env ".env.bak.$(date +%s)"
          before=$(wc -l < .env)
          awk -v img="$NEW_IMAGE" '
            /^UPTIMEPAGE_IMAGE=/ { print "UPTIMEPAGE_IMAGE=" img; seen=1; next }
            { print }
            END { if (!seen) exit 3 }
          ' .env > .env.next
          mv .env.next .env
          after=$(wc -l < .env)
          [ "$before" = "$after" ] || { echo "::error::.env line count changed $before -> $after"; exit 1; }
          grep -qxF "UPTIMEPAGE_IMAGE=$NEW_IMAGE" .env \
            || { echo "::error::UPTIMEPAGE_IMAGE not set to $NEW_IMAGE"; exit 1; }
          # Keep the 10 most recent backups; prune the rest so deploys don't litter.
          ls -1t .env.bak.* 2>/dev/null | tail -n +11 | xargs -r rm -f

          # --- managed Grafana Cloud metrics env (optional) -----------------
          # Same write contract as the image bump: cp backup FIRST, then a
          # single awk pass reprints EVERY line (never grep -v | append |
          # mv), replacing each managed key in place or appending it if
          # absent. Values arrive via the remote environment (awk ENVIRON
          # / printenv) so they are byte-exact (slash/equals/plus safe) and
          # never enter argv or a `set -x` trace; the run log masks the
          # registered secrets. The whole block is skipped unless all three
          # are set (a half-config must not write empty keys or start a
          # crash-looping sidecar). NOTE: a secret value containing a
          # single quote would break the ssh-arg quoting above — Grafana
          # tokens/URL/id never contain one (same assumption as NEW_IMAGE).
          if [ -n "${GRAFANA_CLOUD_PROM_URL:-}" ] \
             && [ -n "${GRAFANA_CLOUD_PROM_USER:-}" ] \
             && [ -n "${GRAFANA_CLOUD_API_TOKEN:-}" ]; then
            cp .env ".env.bak.$(date +%s).grafana"
            # NR (record count) is trailing-newline-agnostic, unlike wc -l:
            # a .env without a final newline must not false-abort the roll.
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["GRAFANA_CLOUD_PROM_URL"]  = ENVIRON["GRAFANA_CLOUD_PROM_URL"]
                m["GRAFANA_CLOUD_PROM_USER"] = ENVIRON["GRAFANA_CLOUD_PROM_USER"]
                m["GRAFANA_CLOUD_API_TOKEN"] = ENVIRON["GRAFANA_CLOUD_API_TOKEN"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+3 lines may be appended (keys absent before); anything
            # outside that means the reprint dropped/duplicated a line.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 3))" ]; then
              echo "::error::.env line count out of range after grafana upsert (${before} -> ${after})"
              exit 1
            fi
            # Authoritative check: each key present EXACTLY once with the
            # exact value (catches a missed append or a stray duplicate
            # that the coarse line-count bound could mask).
            for k in GRAFANA_CLOUD_PROM_URL GRAFANA_CLOUD_PROM_USER GRAFANA_CLOUD_API_TOKEN; do
              n=$(grep -cxF "${k}=$(printenv "$k")" .env || true)
              [ "$n" = 1 ] || { echo "::error::${k} not written exactly once to .env (count=${n})"; exit 1; }
            done
            # No prune here — the image-bump prune above already bounds
            # .env.bak.* to the 10 newest each deploy.
          fi

          # --- managed Grafana Cloud Loki env (optional) --------------------
          # Logs ride the same Alloy sidecar as metrics. The access-policy
          # token is shared (already upserted above as
          # GRAFANA_CLOUD_API_TOKEN — it only needs logs:write added on
          # the policy), so this block carries just the Loki URL + numeric
          # instance id. Same write contract as the metrics block: cp
          # backup FIRST, single awk reprint (never grep -v | append |
          # mv), ENVIRON values, line-count bound, exactly-once verify.
          # Gated on both being set; the Alloy logs pipeline stays inert
          # (config.alloy resolves an unreachable placeholder URL) until
          # they are, so a half-config never disturbs metrics.
          if [ -n "${GRAFANA_CLOUD_LOKI_URL:-}" ] \
             && [ -n "${GRAFANA_CLOUD_LOKI_USER:-}" ]; then
            cp .env ".env.bak.$(date +%s).loki"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["GRAFANA_CLOUD_LOKI_URL"]  = ENVIRON["GRAFANA_CLOUD_LOKI_URL"]
                m["GRAFANA_CLOUD_LOKI_USER"] = ENVIRON["GRAFANA_CLOUD_LOKI_USER"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+2 lines may be appended (both keys absent before).
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 2))" ]; then
              echo "::error::.env line count out of range after loki upsert (${before} -> ${after})"
              exit 1
            fi
            for k in GRAFANA_CLOUD_LOKI_URL GRAFANA_CLOUD_LOKI_USER; do
              n=$(grep -cxF "${k}=$(printenv "$k")" .env || true)
              [ "$n" = 1 ] || { echo "::error::${k} not written exactly once to .env (count=${n})"; exit 1; }
            done
          fi

          # --- managed in-app OTLP trace env (optional) ---------------------
          # Same write contract as the metrics block: cp backup FIRST, one
          # awk pass reprinting EVERY line (never grep -v | append | mv),
          # values via ENVIRON so they are byte-exact and never enter argv
          # or a trace. Presence of all three connection values is the
          # enable signal — the two on/off flags are then forced true.
          # Removing the secrets only SKIPS this block (the prior flags
          # persist in .env); to disable, clear the keys there. A half-config
          # (missing one) writes nothing rather than a broken partial.
          if [ -n "${GRAFANA_OTLP_ENDPOINT:-}" ] \
             && [ -n "${GRAFANA_OTLP_INSTANCE_ID:-}" ] \
             && [ -n "${GRAFANA_OTLP_API_TOKEN:-}" ]; then
            cp .env ".env.bak.$(date +%s).otlp"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["GRAFANA_OTLP_ENDPOINT"]          = ENVIRON["GRAFANA_OTLP_ENDPOINT"]
                m["GRAFANA_OTLP_INSTANCE_ID"]       = ENVIRON["GRAFANA_OTLP_INSTANCE_ID"]
                m["GRAFANA_OTLP_API_TOKEN"]         = ENVIRON["GRAFANA_OTLP_API_TOKEN"]
                m["GRAFANA_OTLP_ENABLED"]           = "true"
                m["UPTIMEPAGE_TRACING_ENABLED"] = "true"
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+5 lines may be appended (all five keys absent before).
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 5))" ]; then
              echo "::error::.env line count out of range after otlp upsert (${before} -> ${after})"
              exit 1
            fi
            for k in GRAFANA_OTLP_ENDPOINT GRAFANA_OTLP_INSTANCE_ID GRAFANA_OTLP_API_TOKEN; do
              n=$(grep -cxF "${k}=$(printenv "$k")" .env || true)
              [ "$n" = 1 ] || { echo "::error::${k} not written exactly once to .env (count=${n})"; exit 1; }
            done
            for k in GRAFANA_OTLP_ENABLED UPTIMEPAGE_TRACING_ENABLED; do
              n=$(grep -cxF "${k}=true" .env || true)
              [ "$n" = 1 ] || { echo "::error::${k} not written exactly once to .env (count=${n})"; exit 1; }
            done
          fi

          # --- managed external heartbeat (optional) ------------------------
          # Same write contract as the OTLP block: present → write URL +
          # ENABLED=true. Removing the secret only SKIPS this block, so a prior
          # HEARTBEAT_* persists in .env — to disable, clear those keys there.
          if [ -n "${HEARTBEAT_URL:-}" ]; then
            cp .env ".env.bak.$(date +%s).heartbeat"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["HEARTBEAT_URL"]     = ENVIRON["HEARTBEAT_URL"]
                m["HEARTBEAT_ENABLED"] = "true"
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+2: appended only if both keys were absent before.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 2))" ]; then
              echo "::error::.env line count out of range after heartbeat upsert (${before} -> ${after})"
              exit 1
            fi
            n=$(grep -cxF "HEARTBEAT_URL=$(printenv HEARTBEAT_URL)" .env || true)
            [ "$n" = 1 ] || { echo "::error::HEARTBEAT_URL not written exactly once to .env (count=${n})"; exit 1; }
            n=$(grep -cxF "HEARTBEAT_ENABLED=true" .env || true)
            [ "$n" = 1 ] || { echo "::error::HEARTBEAT_ENABLED not written exactly once to .env (count=${n})"; exit 1; }
          fi

          # --- managed operator admin token (optional) ----------------------
          # Same write contract as the heartbeat block. Empty only SKIPS this;
          # to disable, clear the key in .env (the surface then 404s).
          if [ -n "${OPERATOR_ADMIN_TOKEN:-}" ]; then
            cp .env ".env.bak.$(date +%s).operator"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN { m["UPTIMEPAGE_OPERATOR_ADMIN_TOKEN"] = ENVIRON["OPERATOR_ADMIN_TOKEN"] }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+1: appended only if the key was absent before.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 1))" ]; then
              echo "::error::.env line count out of range after operator upsert (${before} -> ${after})"
              exit 1
            fi
            n=$(grep -cxF "UPTIMEPAGE_OPERATOR_ADMIN_TOKEN=$(printenv OPERATOR_ADMIN_TOKEN)" .env || true)
            [ "$n" = 1 ] || { echo "::error::UPTIMEPAGE_OPERATOR_ADMIN_TOKEN not written exactly once to .env (count=${n})"; exit 1; }
          fi

          # --- dashboard / agent split (optional) ----------------------------
          # HOME_AGENT_TOKEN is the co-located agent credential (secret); the
          # three SCHEDULER knobs select brain-only + home region (Actions vars,
          # plain config). Each key is upserted only when set; an absent one
          # leaves the prior .env value (compose defaults = all-in-one). To
          # revert, clear the key in .env. Same per-key write-once contract as
          # the blocks above. The agent-side keys (HOME_AGENT_TOKEN,
          # AGENT_FLOW_ENABLED) reach the running agent on its next
          # deploy-agent run; this workflow never recreates it.
          for k in HOME_AGENT_TOKEN UPTIMEPAGE_SCHEDULER_ENABLED \
                   UPTIMEPAGE_SCHEDULER_REGION UPTIMEPAGE_SCHEDULER_DEFAULT_REGION \
                   AGENT_FLOW_ENABLED UPTIMEPAGE_EMAIL_POLICY_ENABLED \
                   UPTIMEPAGE_EMAIL_POLICY_SIGNUP_POLICY; do
            v=$(printenv "$k" || true)
            [ -n "$v" ] || continue
            cp .env ".env.bak.$(date +%s).split.${k}"
            before=$(awk 'END { print NR }' .env)
            K="$k" V="$v" awk '
              BEGIN { key = ENVIRON["K"]; val = ENVIRON["V"] }
              { if ($0 ~ ("^" key "=")) { print key "=" val; seen = 1; next } print }
              END { if (!seen) print key "=" val }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 1))" ]; then
              echo "::error::.env line count out of range after ${k} upsert (${before} -> ${after})"
              exit 1
            fi
            n=$(grep -cxF "${k}=${v}" .env || true)
            [ "$n" = 1 ] || { echo "::error::${k} not written exactly once to .env (count=${n})"; exit 1; }
          done

          # --- managed central Telegram bot (optional) ----------------------
          # Same write contract as the operator block. All-or-nothing: a set
          # token with a missing username/short secret would fail the app's
          # boot validation AFTER the cutover started — fail here instead.
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
            if [ -z "${TELEGRAM_BOT_USERNAME:-}" ] || [ "${#TELEGRAM_WEBHOOK_SECRET}" -lt 32 ]; then
              echo "::error::TELEGRAM_BOT_TOKEN is set but TELEGRAM_BOT_USERNAME is empty or TELEGRAM_WEBHOOK_SECRET is shorter than 32 chars"
              exit 1
            fi
            cp .env ".env.bak.$(date +%s).telegram"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["UPTIMEPAGE_TELEGRAM_BOT_TOKEN"]      = ENVIRON["TELEGRAM_BOT_TOKEN"]
                m["UPTIMEPAGE_TELEGRAM_BOT_USERNAME"]   = ENVIRON["TELEGRAM_BOT_USERNAME"]
                m["UPTIMEPAGE_TELEGRAM_WEBHOOK_SECRET"] = ENVIRON["TELEGRAM_WEBHOOK_SECRET"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+3: appended only for keys absent before.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 3))" ]; then
              echo "::error::.env line count out of range after telegram upsert (${before} -> ${after})"
              exit 1
            fi
            for pair in \
              "UPTIMEPAGE_TELEGRAM_BOT_TOKEN=$(printenv TELEGRAM_BOT_TOKEN)" \
              "UPTIMEPAGE_TELEGRAM_BOT_USERNAME=$(printenv TELEGRAM_BOT_USERNAME)" \
              "UPTIMEPAGE_TELEGRAM_WEBHOOK_SECRET=$(printenv TELEGRAM_WEBHOOK_SECRET)"; do
              n=$(grep -cxF "$pair" .env || true)
              [ "$n" = 1 ] || { echo "::error::${pair%%=*} not written exactly once to .env (count=${n})"; exit 1; }
            done
          fi

          # --- Slack OAuth app (optional) ------------------------------------
          # Same write contract as the blocks above. All-or-nothing: a lone
          # client id would render the button against a doomed exchange.
          if [ -n "${SLACK_OAUTH_CLIENT_ID:-}" ]; then
            if [ -z "${SLACK_OAUTH_CLIENT_SECRET:-}" ]; then
              echo "::error::SLACK_OAUTH_CLIENT_ID is set but SLACK_OAUTH_CLIENT_SECRET is empty"
              exit 1
            fi
            cp .env ".env.bak.$(date +%s).slack"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["UPTIMEPAGE_SLACK_OAUTH_CLIENT_ID"]     = ENVIRON["SLACK_OAUTH_CLIENT_ID"]
                m["UPTIMEPAGE_SLACK_OAUTH_CLIENT_SECRET"] = ENVIRON["SLACK_OAUTH_CLIENT_SECRET"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+2: appended only for keys absent before.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 2))" ]; then
              echo "::error::.env line count out of range after slack upsert (${before} -> ${after})"
              exit 1
            fi
            for pair in \
              "UPTIMEPAGE_SLACK_OAUTH_CLIENT_ID=$(printenv SLACK_OAUTH_CLIENT_ID)" \
              "UPTIMEPAGE_SLACK_OAUTH_CLIENT_SECRET=$(printenv SLACK_OAUTH_CLIENT_SECRET)"; do
              n=$(grep -cxF "$pair" .env || true)
              [ "$n" = 1 ] || { echo "::error::${pair%%=*} not written exactly once to .env (count=${n})"; exit 1; }
            done
          fi

          # --- Discord OAuth app (optional) ----------------------------------
          # Same write contract and all-or-nothing rule as the Slack block.
          if [ -n "${DISCORD_OAUTH_CLIENT_ID:-}" ]; then
            if [ -z "${DISCORD_OAUTH_CLIENT_SECRET:-}" ]; then
              echo "::error::DISCORD_OAUTH_CLIENT_ID is set but DISCORD_OAUTH_CLIENT_SECRET is empty"
              exit 1
            fi
            cp .env ".env.bak.$(date +%s).discord"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["UPTIMEPAGE_DISCORD_OAUTH_CLIENT_ID"]     = ENVIRON["DISCORD_OAUTH_CLIENT_ID"]
                m["UPTIMEPAGE_DISCORD_OAUTH_CLIENT_SECRET"] = ENVIRON["DISCORD_OAUTH_CLIENT_SECRET"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+2: appended only for keys absent before.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 2))" ]; then
              echo "::error::.env line count out of range after discord upsert (${before} -> ${after})"
              exit 1
            fi
            for pair in \
              "UPTIMEPAGE_DISCORD_OAUTH_CLIENT_ID=$(printenv DISCORD_OAUTH_CLIENT_ID)" \
              "UPTIMEPAGE_DISCORD_OAUTH_CLIENT_SECRET=$(printenv DISCORD_OAUTH_CLIENT_SECRET)"; do
              n=$(grep -cxF "$pair" .env || true)
              [ "$n" = 1 ] || { echo "::error::${pair%%=*} not written exactly once to .env (count=${n})"; exit 1; }
            done
          fi

          # --- Google OAuth login (optional) ----------------------------------
          # Same write contract and all-or-nothing rule as the Slack block.
          # UPTIMEPAGE_AUTH_GOOGLE_REDIRECT_URL stays manually managed in the
          # server .env, same as the GitHub login trio.
          if [ -n "${GOOGLE_OAUTH_CLIENT_ID:-}" ]; then
            if [ -z "${GOOGLE_OAUTH_CLIENT_SECRET:-}" ]; then
              echo "::error::GOOGLE_OAUTH_CLIENT_ID is set but GOOGLE_OAUTH_CLIENT_SECRET is empty"
              exit 1
            fi
            cp .env ".env.bak.$(date +%s).google"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["UPTIMEPAGE_AUTH_GOOGLE_CLIENT_ID"]     = ENVIRON["GOOGLE_OAUTH_CLIENT_ID"]
                m["UPTIMEPAGE_AUTH_GOOGLE_CLIENT_SECRET"] = ENVIRON["GOOGLE_OAUTH_CLIENT_SECRET"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+2: appended only for keys absent before.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 2))" ]; then
              echo "::error::.env line count out of range after google upsert (${before} -> ${after})"
              exit 1
            fi
            for pair in \
              "UPTIMEPAGE_AUTH_GOOGLE_CLIENT_ID=$(printenv GOOGLE_OAUTH_CLIENT_ID)" \
              "UPTIMEPAGE_AUTH_GOOGLE_CLIENT_SECRET=$(printenv GOOGLE_OAUTH_CLIENT_SECRET)"; do
              n=$(grep -cxF "$pair" .env || true)
              [ "$n" = 1 ] || { echo "::error::${pair%%=*} not written exactly once to .env (count=${n})"; exit 1; }
            done
          fi

          # --- Microsoft OAuth login (optional) -------------------------------
          # Same write contract and all-or-nothing rule as the Google block.
          # REDIRECT_URL and TENANT stay manually managed in the server .env,
          # same as the GitHub and Google login trios.
          if [ -n "${MICROSOFT_OAUTH_CLIENT_ID:-}" ]; then
            if [ -z "${MICROSOFT_OAUTH_CLIENT_SECRET:-}" ]; then
              echo "::error::MICROSOFT_OAUTH_CLIENT_ID is set but MICROSOFT_OAUTH_CLIENT_SECRET is empty"
              exit 1
            fi
            cp .env ".env.bak.$(date +%s).microsoft"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["UPTIMEPAGE_AUTH_MICROSOFT_CLIENT_ID"]     = ENVIRON["MICROSOFT_OAUTH_CLIENT_ID"]
                m["UPTIMEPAGE_AUTH_MICROSOFT_CLIENT_SECRET"] = ENVIRON["MICROSOFT_OAUTH_CLIENT_SECRET"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+2: appended only for keys absent before.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 2))" ]; then
              echo "::error::.env line count out of range after microsoft upsert (${before} -> ${after})"
              exit 1
            fi
            for pair in \
              "UPTIMEPAGE_AUTH_MICROSOFT_CLIENT_ID=$(printenv MICROSOFT_OAUTH_CLIENT_ID)" \
              "UPTIMEPAGE_AUTH_MICROSOFT_CLIENT_SECRET=$(printenv MICROSOFT_OAUTH_CLIENT_SECRET)"; do
              n=$(grep -cxF "$pair" .env || true)
              [ "$n" = 1 ] || { echo "::error::${pair%%=*} not written exactly once to .env (count=${n})"; exit 1; }
            done
          fi

          # --- GitLab OAuth login (optional) ----------------------------------
          # Same write contract and all-or-nothing rule as the Google block.
          # REDIRECT_URL and BASE_URL stay manually managed in the server .env,
          # same as the GitHub, Google and Microsoft login trios.
          if [ -n "${GITLAB_OAUTH_CLIENT_ID:-}" ]; then
            if [ -z "${GITLAB_OAUTH_CLIENT_SECRET:-}" ]; then
              echo "::error::GITLAB_OAUTH_CLIENT_ID is set but GITLAB_OAUTH_CLIENT_SECRET is empty"
              exit 1
            fi
            cp .env ".env.bak.$(date +%s).gitlab"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["UPTIMEPAGE_AUTH_GITLAB_CLIENT_ID"]     = ENVIRON["GITLAB_OAUTH_CLIENT_ID"]
                m["UPTIMEPAGE_AUTH_GITLAB_CLIENT_SECRET"] = ENVIRON["GITLAB_OAUTH_CLIENT_SECRET"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next && mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+2: appended only for keys absent before.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 2))" ]; then
              echo "::error::.env line count out of range after gitlab upsert (${before} -> ${after})"
              exit 1
            fi
            for pair in \
              "UPTIMEPAGE_AUTH_GITLAB_CLIENT_ID=$(printenv GITLAB_OAUTH_CLIENT_ID)" \
              "UPTIMEPAGE_AUTH_GITLAB_CLIENT_SECRET=$(printenv GITLAB_OAUTH_CLIENT_SECRET)"; do
              n=$(grep -cxF "$pair" .env || true)
              [ "$n" = 1 ] || { echo "::error::${pair%%=*} not written exactly once to .env (count=${n})"; exit 1; }
            done
          fi

          # --- operator WhatsApp number (optional) ---------------------------
          # Same write contract as the blocks above. All-or-nothing on the
          # cred sextet: any partial set would fail the app's boot validation
          # AFTER the cutover started — fail here instead. The enable flag is
          # written only when the repo var is set, so creds can land dark.
          if [ -n "${WHATSAPP_APP_ACCESS_TOKEN:-}" ]; then
            if [ -z "${WHATSAPP_APP_PHONE_NUMBER_ID:-}" ] || [ -z "${WHATSAPP_APP_PUBLIC_NUMBER:-}" ] \
               || [ -z "${WHATSAPP_APP_SECRET:-}" ] || [ "${#WHATSAPP_APP_VERIFY_TOKEN}" -lt 32 ] \
               || [ -z "${WHATSAPP_APP_TEMPLATE_NAME:-}" ]; then
              echo "::error::WHATSAPP_APP_ACCESS_TOKEN is set but the rest of the sextet is incomplete (verify token must be 32+ chars)"
              exit 1
            fi
            cp .env ".env.bak.$(date +%s).whatsapp"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["UPTIMEPAGE_WHATSAPP_APP_ACCESS_TOKEN"]    = ENVIRON["WHATSAPP_APP_ACCESS_TOKEN"]
                m["UPTIMEPAGE_WHATSAPP_APP_PHONE_NUMBER_ID"] = ENVIRON["WHATSAPP_APP_PHONE_NUMBER_ID"]
                m["UPTIMEPAGE_WHATSAPP_APP_PUBLIC_NUMBER"]   = ENVIRON["WHATSAPP_APP_PUBLIC_NUMBER"]
                m["UPTIMEPAGE_WHATSAPP_APP_APP_SECRET"]      = ENVIRON["WHATSAPP_APP_SECRET"]
                m["UPTIMEPAGE_WHATSAPP_APP_VERIFY_TOKEN"]    = ENVIRON["WHATSAPP_APP_VERIFY_TOKEN"]
                m["UPTIMEPAGE_WHATSAPP_APP_TEMPLATE_NAME"]   = ENVIRON["WHATSAPP_APP_TEMPLATE_NAME"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+6: appended only for keys absent before.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 6))" ]; then
              echo "::error::.env line count out of range after whatsapp upsert (${before} -> ${after})"
              exit 1
            fi
            for pair in \
              "UPTIMEPAGE_WHATSAPP_APP_ACCESS_TOKEN=$(printenv WHATSAPP_APP_ACCESS_TOKEN)" \
              "UPTIMEPAGE_WHATSAPP_APP_PHONE_NUMBER_ID=$(printenv WHATSAPP_APP_PHONE_NUMBER_ID)" \
              "UPTIMEPAGE_WHATSAPP_APP_PUBLIC_NUMBER=$(printenv WHATSAPP_APP_PUBLIC_NUMBER)" \
              "UPTIMEPAGE_WHATSAPP_APP_APP_SECRET=$(printenv WHATSAPP_APP_SECRET)" \
              "UPTIMEPAGE_WHATSAPP_APP_VERIFY_TOKEN=$(printenv WHATSAPP_APP_VERIFY_TOKEN)" \
              "UPTIMEPAGE_WHATSAPP_APP_TEMPLATE_NAME=$(printenv WHATSAPP_APP_TEMPLATE_NAME)"; do
              n=$(grep -cxF "$pair" .env || true)
              [ "$n" = 1 ] || { echo "::error::${pair%%=*} not written exactly once to .env (count=${n})"; exit 1; }
            done
            if [ -n "${WHATSAPP_APP_ENABLED:-}" ]; then
              cp .env ".env.bak.$(date +%s).whatsapp-flag"
              before=$(awk 'END { print NR }' .env)
              awk '
                BEGIN { m["UPTIMEPAGE_WHATSAPP_APP_ENABLED"] = ENVIRON["WHATSAPP_APP_ENABLED"] }
                {
                  for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                  print
                }
                END { for (k in m) if (!seen[k]) print k "=" m[k] }
              ' .env > .env.next
              mv .env.next .env
              after=$(awk 'END { print NR }' .env)
              if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 1))" ]; then
                echo "::error::.env line count out of range after whatsapp-flag upsert (${before} -> ${after})"
                exit 1
              fi
              n=$(grep -cxF "UPTIMEPAGE_WHATSAPP_APP_ENABLED=$(printenv WHATSAPP_APP_ENABLED)" .env || true)
              [ "$n" = 1 ] || { echo "::error::UPTIMEPAGE_WHATSAPP_APP_ENABLED not written exactly once to .env (count=${n})"; exit 1; }
            fi
          fi

          # --- transactional mail via Resend (optional) ----------------------
          # Same write contract as the blocks above. All-or-nothing on the
          # sending pair: an API key without a verified From address would
          # fail every send after the cutover — fail here instead. The
          # webhook secret rides along when set; alone it is pointless but
          # harmless, so it is not required.
          if [ -n "${RESEND_API_KEY:-}" ]; then
            if [ -z "${EMAIL_FROM_ADDRESS:-}" ]; then
              echo "::error::RESEND_API_KEY is set but EMAIL_FROM_ADDRESS is empty"
              exit 1
            fi
            cp .env ".env.bak.$(date +%s).resend"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["UPTIMEPAGE_EMAIL_PROVIDER"]              = "resend"
                m["UPTIMEPAGE_EMAIL_FROM_ADDRESS"]          = ENVIRON["EMAIL_FROM_ADDRESS"]
                m["UPTIMEPAGE_EMAIL_RESEND_API_KEY"]        = ENVIRON["RESEND_API_KEY"]
                m["UPTIMEPAGE_EMAIL_RESEND_WEBHOOK_SECRET"] = ENVIRON["RESEND_WEBHOOK_SECRET"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+4: appended only for keys absent before.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 4))" ]; then
              echo "::error::.env line count out of range after resend upsert (${before} -> ${after})"
              exit 1
            fi
            for pair in \
              "UPTIMEPAGE_EMAIL_PROVIDER=resend" \
              "UPTIMEPAGE_EMAIL_FROM_ADDRESS=$(printenv EMAIL_FROM_ADDRESS)" \
              "UPTIMEPAGE_EMAIL_RESEND_API_KEY=$(printenv RESEND_API_KEY)" \
              "UPTIMEPAGE_EMAIL_RESEND_WEBHOOK_SECRET=$(printenv RESEND_WEBHOOK_SECRET)"; do
              n=$(grep -cxF "$pair" .env || true)
              [ "$n" = 1 ] || { echo "::error::${pair%%=*} not written exactly once to .env (count=${n})"; exit 1; }
            done
          fi

          # --- managed help-form inbox (optional) ---------------------------
          # Non-secret address, sourced from the repo *variable*
          # EMAIL_SUPPORT_ADDRESS. Same write contract as the blocks above.
          # Separate from the resend block because it gates a surface rather
          # than delivery: setting it mounts /help and POST /api/v1/support,
          # and mail still needs the provider above to actually leave the box.
          # Skipped when unset, so the compose `${…:-}` fallback keeps the
          # form absent; to switch it off later, clear the key in .env.
          if [ -n "${EMAIL_SUPPORT_ADDRESS:-}" ]; then
            cp .env ".env.bak.$(date +%s).support"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN { m["UPTIMEPAGE_EMAIL_SUPPORT_ADDRESS"] = ENVIRON["EMAIL_SUPPORT_ADDRESS"] }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+1: appended only if the key was absent before.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 1))" ]; then
              echo "::error::.env line count out of range after support upsert (${before} -> ${after})"
              exit 1
            fi
            n=$(grep -cxF "UPTIMEPAGE_EMAIL_SUPPORT_ADDRESS=$(printenv EMAIL_SUPPORT_ADDRESS)" .env || true)
            [ "$n" = 1 ] || { echo "::error::EMAIL_SUPPORT_ADDRESS not written exactly once to .env (count=${n})"; exit 1; }
          fi

          # --- managed RUST_LOG (optional) ----------------------------------
          # Non-secret log/trace filter, sourced from the repo *variable*
          # RUST_LOG (vars, not secrets). Same write contract as the blocks
          # above: cp backup FIRST, single awk reprint (never grep -v |
          # append | mv), ENVIRON value, line-count bound, exactly-once
          # verify. Skipped when the variable is unset so the compose
          # `${RUST_LOG:-debug}` fallback governs; setting it lets an
          # operator retune verbosity with only a redeploy (no rebuild).
          if [ -n "${RUST_LOG:-}" ]; then
            cp .env ".env.bak.$(date +%s).rustlog"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN { m["RUST_LOG"] = ENVIRON["RUST_LOG"] }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+1: appended only if RUST_LOG was absent before.
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 1))" ]; then
              echo "::error::.env line count out of range after rustlog upsert (${before} -> ${after})"
              exit 1
            fi
            n=$(grep -cxF "RUST_LOG=$(printenv RUST_LOG)" .env || true)
            [ "$n" = 1 ] || { echo "::error::RUST_LOG not written exactly once to .env (count=${n})"; exit 1; }
          fi

          # --- managed MCP enable flags (optional) --------------------------
          # Non-secret on/off flags, sourced from the repo *variables*
          # MCP_ENABLED / MCP_OAUTH_ENABLED (passed as UPTIMEPAGE_MCP_ENABLED /
          # UPTIMEPAGE_MCP_OAUTH_ENABLED). Same write contract as the blocks
          # above: cp backup FIRST, single awk reprint, ENVIRON values,
          # line-count bound, exactly-once verify. Runs when either is set;
          # an unset flag is written as its (possibly empty) value, which the
          # compose `${…:-false}` fallback reads as false. NOTE: with OAuth on,
          # the app refuses to boot unless UPTIMEPAGE_AUTH_PUBLIC_BASE_URL is a
          # real https origin — keep that set before flipping MCP_OAUTH_ENABLED.
          if [ -n "${UPTIMEPAGE_MCP_ENABLED:-}" ] \
             || [ -n "${UPTIMEPAGE_MCP_OAUTH_ENABLED:-}" ]; then
            cp .env ".env.bak.$(date +%s).mcp"
            before=$(awk 'END { print NR }' .env)
            awk '
              BEGIN {
                m["UPTIMEPAGE_MCP_ENABLED"]       = ENVIRON["UPTIMEPAGE_MCP_ENABLED"]
                m["UPTIMEPAGE_MCP_OAUTH_ENABLED"] = ENVIRON["UPTIMEPAGE_MCP_OAUTH_ENABLED"]
              }
              {
                for (k in m) if ($0 ~ ("^" k "=")) { print k "=" m[k]; seen[k] = 1; next }
                print
              }
              END { for (k in m) if (!seen[k]) print k "=" m[k] }
            ' .env > .env.next
            mv .env.next .env
            after=$(awk 'END { print NR }' .env)
            # 0..+2 lines may be appended (both keys absent before).
            if [ "$after" -lt "$before" ] || [ "$after" -gt "$((before + 2))" ]; then
              echo "::error::.env line count out of range after mcp upsert (${before} -> ${after})"
              exit 1
            fi
            for k in UPTIMEPAGE_MCP_ENABLED UPTIMEPAGE_MCP_OAUTH_ENABLED; do
              n=$(grep -cxF "${k}=$(printenv "$k")" .env || true)
              [ "$n" = 1 ] || { echo "::error::${k} not written exactly once to .env (count=${n})"; exit 1; }
            done
          fi

          # Defensive fallback: tighten .env perms in case the file predates
          # the umask 077 at the top of this script (umask only affects NEW
          # files; a .env written by a pre-this-commit deploy stays 0644).
          # Backups inherit perms from `cp .env …` which is 0600 now, so no
          # explicit chmod needed for .env.bak.*.
          chmod 600 .env

          # --- pull the new image FIRST -------------------------------------
          # Slow, network-fragile step. Do it while the OLD container still
          # serves: if the ssh session dies here the site stays up on the old
          # image. (Pulling AFTER stop+drop once left prod 502 with an empty
          # DB when a session truncated mid-pull.)
          #
          # The package is public, so this login is for the higher authenticated
          # pull rate limit, and so a re-privatised package doesn't break deploys.
          # The job's GITHUB_TOKEN carries packages:read; the login is ephemeral.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull "$TARGET_SVC"

          # --- blue/green cutover -------------------------------------------
          # Boot the idle color on the new image while the active color keeps
          # serving. Its deps (postgres/clickhouse) start too if down, but the
          # active color + caddy are untouched. --force-recreate when OTLP
          # trace creds are managed here so a same-tag token rotation actually
          # lands (otherwise `up -d` keeps the old container + stale env); a
          # normal image bump recreates anyway.
          if [ -n "${GRAFANA_OTLP_ENDPOINT:-}" ] \
             && [ -n "${GRAFANA_OTLP_INSTANCE_ID:-}" ] \
             && [ -n "${GRAFANA_OTLP_API_TOKEN:-}" ]; then
            docker compose up -d --no-build --force-recreate "$TARGET_SVC"
          else
            docker compose up -d --no-build "$TARGET_SVC"
          fi

          # Gate on the NEW color's /readyz (DB reachable + migrations applied)
          # BEFORE shifting traffic. Probe it on the internal docker network
          # from the clickhouse container (always up as an app dependency, and
          # ships wget) — the app image is distroless and the host can't reach
          # :8080 (no published port). Caddy still routes to the OLD color
          # throughout this wait, so a slow/failed boot never drops traffic.
          ready=""
          for i in $(seq 1 30); do
            if docker compose exec -T clickhouse \
                 wget -q -T 5 -t 1 -O /dev/null "http://${TARGET_SVC}:8080/readyz"; then
              ready=1; echo "${TARGET_SVC} ready after ${i} attempt(s)"; break
            fi
            [ "$i" -lt 30 ] && sleep 5
          done
          if [ -z "$ready" ]; then
            echo "::error::${TARGET_SVC} did not become ready within ~150s — aborting cutover; ${active:-previous} color still serving"
            docker compose logs --tail=80 "$TARGET_SVC" || true
            docker compose stop "$TARGET_SVC" || true
            exit 1
          fi

          # New color is ready and Caddy's active /readyz check now routes to
          # it. Stop the previous color — axum drains in-flight requests
          # within stop_grace_period (30s). Keep it stopped (not removed) so a
          # rollback is an instant `docker compose start uptimepage_${active}`.
          if [ -n "$active" ]; then
            echo "cutover ok; stopping previous color uptimepage_${active}"
            docker compose stop "uptimepage_${active}"
          fi

          # Post-cutover gate. The readyz probe above is a single reachability
          # check on the new color before traffic shifts; this asserts the
          # dependencies are sustainably healthy and the new color stayed up
          # once it took load — catches a store that is up-but-boot-looping or
          # a color that OOMs under real traffic, which readyz alone misses.
          for dep in postgres clickhouse caddy; do
            health="unknown"
            for _ in $(seq 1 6); do
              health=$(docker inspect -f '{{ .State.Health.Status }}' \
                "$(docker compose ps -q "$dep")" 2>/dev/null || echo unknown)
              [ "$health" = "healthy" ] && break
              sleep 5   # tolerate a brief "starting" right after a recreate
            done
            if [ "$health" != "healthy" ]; then
              echo "::error::${dep} not healthy after cutover (status=${health})"
              docker compose logs --tail=60 "$dep" || true
              exit 1
            fi
          done
          tgt_state=$(docker inspect -f '{{ .State.Status }}' \
            "$(docker compose ps -q "$TARGET_SVC")" 2>/dev/null || echo unknown)
          if [ "$tgt_state" != "running" ]; then
            echo "::error::${TARGET_SVC} is ${tgt_state} after cutover, expected running"
            docker compose logs --tail=80 "$TARGET_SVC" || true
            # New color died after the old one was stopped — a full outage that
            # readyz (probed pre-traffic) can't catch. Use the blue/green
            # reserve: restart the previous color, confirm it actually serves,
            # then retire the dead color so Caddy stops retrying it. The deploy
            # still fails — operator must investigate — but prod self-restores.
            # .active_color is untouched above on this path, so it still names
            # the previous color: no fixup needed.
            if [ -n "$active" ]; then
              prev="uptimepage_${active}"
              echo "rolling back to previous color ${prev}"
              docker compose start "$prev" || true
              rolled_back=""
              for i in $(seq 1 24); do
                if docker compose exec -T clickhouse \
                     wget -q -T 5 -t 1 -O /dev/null "http://${prev}:8080/readyz"; then
                  rolled_back=1; echo "rollback ok: ${prev} ready after ${i} attempt(s)"; break
                fi
                [ "$i" -lt 24 ] && sleep 5
              done
              docker compose stop "$TARGET_SVC" || true
              if [ -n "$rolled_back" ]; then
                echo "::warning::deploy failed but rolled back to ${prev}; prod restored on the previous image"
              else
                echo "::error::rollback FAILED — ${prev} not ready after ~120s; prod is DOWN, manual intervention required"
              fi
            else
              echo "::error::no previous color to roll back to (fresh bring-up); ${TARGET_SVC} is down"
            fi
            exit 1
          fi
          echo "post-cutover health gate ok: deps healthy, ${TARGET_SVC} running"

          # Record the now-active color (hint only; the running container is
          # the source of truth). Owner-only, same discipline as .env.
          printf '%s\n' "$target" > .active_color
          chmod 600 .active_color

          # Caddy: bind-mounted Caddyfile. A `git checkout` of a deploy
          # that edits the file leaves the running container reading the
          # OLD inode (single-file bind mounts pin at mount time, and a
          # `caddy reload` then sees "config is unchanged"). Detect drift
          # by hashing the file on disk vs inside the container; recreate
          # only when they differ. Quiet on no-op deploys; fixes the file
          # without manual `docker compose restart caddy` when it changed.
          host_hash=$(sha256sum Caddyfile 2>/dev/null | awk '{print $1}')
          # Capture the container read's real exit status — don't pipe straight
          # into awk (awk exits 0 and would mask a failed exec) — and keep stderr
          # off the captured stdout (a compose warning would corrupt the hash).
          # On failure, warn and fall through with an empty hash → forces a
          # recreate (safe default) instead of silently skipping it.
          if ctr_line=$(docker compose exec -T caddy sha256sum /etc/caddy/Caddyfile 2>/dev/null); then
            ctr_hash=$(printf '%s' "$ctr_line" | awk '{print $1}')
          else
            echo "::warning::could not read Caddyfile from caddy container; recreating to be safe"
            ctr_hash=""
          fi
          # Every compose call here is --no-build, so a bumped tag (plugin pin
          # moved) would resolve to no image at all. Compare what the container
          # actually runs against the tag, not merely whether the tag exists —
          # a build that landed while the recreate failed must still swap.
          caddy_image=$(docker compose config --images caddy)
          case "$caddy_image" in
            uptimepage-caddy:*) ;;
            *) echo "::error::unexpected caddy image '$caddy_image'"; exit 1 ;;
          esac
          want_id=$(docker image inspect -f '{{ .Id }}' "$caddy_image" 2>/dev/null || echo "")
          run_id=$(docker inspect -f '{{ .Image }}' "$(docker compose ps -q caddy)" 2>/dev/null || echo "")
          caddy_recreated=""
          if [ -z "$want_id" ] || [ "$want_id" != "$run_id" ]; then
            echo "caddy image $caddy_image not the running one; building"
            # --pull: the bases are floating tags and the prune step wipes them,
            # so a cached FROM would silently re-tag the same old binary.
            docker compose build --pull caddy
            # The runbook's own rule: never put an unvalidated config on the one
            # service publishing 80/443. Validate in a throwaway container —
            # a crash-looping caddy has no reserve to fall back to.
            # --env-file: the Caddyfile interpolates {$UPTIMEPAGE_DOMAIN} and
            # friends, so without the real env it fails to adapt on `email`.
            docker run --rm --env-file .env -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
              "$caddy_image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker compose up -d --no-build caddy
            caddy_recreated=1
          fi

          if [ -z "$caddy_recreated" ] && [ -n "$host_hash" ] && [ "$host_hash" != "$ctr_hash" ]; then
            echo "Caddyfile drift (host=${host_hash:0:12} ctr=${ctr_hash:0:12}); recreating caddy"
            docker compose up -d --no-build --force-recreate caddy
          fi

          # Metrics+logs sidecar + host-metrics exporter: profile-gated,
          # scoped by service so the app / postgres / caddy are never
          # recreated as a side effect. node-exporter is alloy's local scrape
          # target for host disk and CPU; started idempotently (no
          # --force-recreate, no drifting config, restart:unless-stopped keeps
          # it up across deploys).
          # Same all-three-metrics-creds gate as the .env upsert (logs ride
          # this same container, so the metrics trio is the prerequisite —
          # a Loki-only config never starts the sidecar). --force-recreate
          # so a credential rotation OR a newly-set Loki pair in this
          # deploy actually takes effect (without it `up -d` keeps the old
          # container + stale env); it recreates ONLY alloy — a few seconds
          # of metrics gap, no app impact.
          if [ -n "${GRAFANA_CLOUD_PROM_URL:-}" ] \
             && [ -n "${GRAFANA_CLOUD_PROM_USER:-}" ] \
             && [ -n "${GRAFANA_CLOUD_API_TOKEN:-}" ]; then
            docker compose --profile metrics up -d --no-build node-exporter
            docker compose --profile metrics up -d --no-build --force-recreate alloy
          fi

          # The co-located regional agent is NOT touched here: it pins its own
          # AGENT_IMAGE and moves only via the deploy-agent workflow, so a
          # dashboard-only deploy never restarts the region's probes.

          docker compose ps

          # Defense in depth: assert internal services carry NO host port
          # bindings. Prod compose uses `expose:` (network-internal only) for
          # postgres/clickhouse/uptimepage; only caddy publishes 80/443.
          # A silent `ports:` edit on postgres/clickhouse would bind DBs to
          # 0.0.0.0 with default monitor/monitor creds = public DB; on the
          # app it would bypass Caddy TLS + expose unauthenticated /metrics
          # on 9090. Fail the deploy so the bad change can't reach steady
          # state unnoticed. `docker compose ps -q` uses the live project
          # name + handles replicas, so it doesn't bit-rot if the project
          # is renamed or scaled.
          for svc in postgres clickhouse uptimepage_blue uptimepage_green agent; do
            for ctr in $(docker compose ps -q "$svc"); do
              bound=$(docker port "$ctr" 2>/dev/null || true)
              if [ -n "$bound" ]; then
                echo "::error::${svc} ($ctr) has host port bindings — must use 'expose:' only:"
                echo "$bound"
                exit 1
              fi
            done
          done
          REMOTE

      - name: health gate
        run: |
          set -euo pipefail
          # Probe /healthz through Caddy from the box (loopback via --resolve so
          # the real cert for app.uptimepage.dev is validated, not bypassed)
          # until the freshly booted app has applied migrations. Fail loud so a
          # bad deploy is never silent.
          ssh -T -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
          # Same heredoc-over-stdin slurp-reexec as the deploy step (see there
          # for the rationale): run the body from a temp file with stdin pinned
          # to /dev/null so a future exec here can't drain the probe loop.
          __body=$(mktemp) || exit 1; trap 'rm -f "$__body"' EXIT; cat >"$__body" || exit 1; bash "$__body" </dev/null; exit $?

          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 \
                 --resolve app.uptimepage.dev:443:127.0.0.1 \
                 https://app.uptimepage.dev/healthz >/dev/null 2>&1; then
              echo "healthy after ${i} attempt(s)"; exit 0
            fi
            [ "$i" -lt 30 ] && sleep 5
          done
          echo "::error::app did not become healthy within ~150s"
          cd /opt/uptimepage/deployment && docker compose logs --tail=80 uptimepage || true
          exit 1
          REMOTE

      - name: prune old images
        run: |
          set -euo pipefail
          # Every deploy pulls a fresh image; unpruned they pile up until the
          # disk fills and stalls ClickHouse writes. Runs only after a healthy
          # gate. prune -a spares any image a container references, so the
          # active color and the stopped previous color (instant rollback) both
          # survive; deeper rollbacks re-pull from GHCR. Best-effort, never
          # fails a deploy.
          ssh -T -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE' || true
          echo "disk before:"; df -h / | tail -1
          docker image prune -af || true
          docker builder prune -af || true
          echo "disk after:"; df -h / | tail -1
          REMOTE

      - name: annotate grafana (optional)
        env:
          ANNO_URL: ${{ secrets.GRAFANA_ANNOTATIONS_URL }}
          ANNO_TOKEN: ${{ secrets.GRAFANA_ANNOTATIONS_TOKEN }}
        run: |
          set -euo pipefail
          # Drop a deploy marker on Grafana so a latency / error-rate
          # shift can be read against "this is the commit that did it".
          # Posted from the runner (Grafana HTTP API, not the box).
          # Inert until both secrets are set — mirrors the metrics/Loki
          # gates. NOTE: ANNO_TOKEN is a Grafana *service-account* token
          # with the annotations:write role — NOT the glc_ ingest token
          # (that one only writes Mimir/Loki/Tempo, not the Grafana API).
          # No `if:` needed — a step runs only on prior success by default.
          if [ -z "${ANNO_URL:-}" ] || [ -z "${ANNO_TOKEN:-}" ]; then
            echo "grafana annotation skipped (secrets unset)"; exit 0
          fi
          ts=$(date +%s%3N)
          # `|| true`: a transport failure (curl non-zero exit — DNS / TLS
          # / connection, NOT an HTTP status) must not trip `set -e` and
          # fail an otherwise-healthy deploy. This step is best-effort:
          # it can warn, never fail the job.
          code=$(curl -sS -o /tmp/anno.out -w '%{http_code}' \
            -X POST "$ANNO_URL" \
            -H "Authorization: Bearer ${ANNO_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "{\"time\":${ts},\"tags\":[\"deploy\",\"uptimepage\",\"prod\"],\"text\":\"deploy ${IMAGE_TAG}\"}" || true)
          if [ -z "$code" ] || [ "$code" = 000 ]; then
            echo "::warning::grafana annotation: curl transport failure (deploy unaffected)"
            exit 0
          fi
          if [ "$code" = 200 ]; then
            echo "grafana annotation posted (${IMAGE_TAG})"
          else
            echo "::warning::grafana annotation POST ${code}: $(head -c 300 /tmp/anno.out 2>/dev/null || true)"
          fi
