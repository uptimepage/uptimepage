name: release-image

# Build the uptimepage container image in CI and push it to the GitHub
# Container Registry. Production pulls an immutable tag (sha-… or v…) and
# never compiles Rust on the box — the build toolchain stays off prod.
#
# Arch: pushes to main publish linux/amd64 only — the live prod hosts are x86,
# so the critical auto-deploy path never waits on (or is blocked by) a second
# architecture. A v* tag publishes both, because a release is what outsiders
# pull by version and ARM nodes are ordinary (Oracle Ampere, Vultr-arm, Hetzner
# CAX, Graviton). A manual run with "include_arm64" adds arm64 to any build.
# Both cases produce a multi-arch manifest list under the same tags; amd64
# hosts keep resolving the amd64 entry, ARM hosts get arm64. Each arch builds
# NATIVELY on its own runner (public-repo arm64 runners are free) — no QEMU,
# which would make the Rust compile multiple times slower.
#
# Publish flow (same for 1 or 2 arches): each arch builds and pushes its image
# by DIGEST only (untagged); a final `merge` job stitches the digests into the
# real tags. With one arch this is a single-entry manifest list, which pulls
# identically to a plain image on that arch.
#
# Tags produced (docker/metadata-action):
#   - main                       (default-branch builds, mutable)
#   - sha-<full-sha>             (immutable; pin prod to this)
#   - latest                     (default-branch only)
#   - <X.Y.Z> and <X.Y>          (only on v* git tags — release pins)

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Denylist, mirrors ci.yml: the image is unaffected by the
    # deploy/dco/issue-template workflows. docs/ is not listed because ci.yml
    # tests it and the two lists must match. Any unlisted path still builds,
    # so new source never skips the image. Keep in sync with ci.yml (GHA can't
    # share a YAML anchor across files).
    paths-ignore:
      - "*.md"
      - "changelog/**"
      - "charts/**"
      - ".github/workflows/charts.yml"
      # canary.yml only runs on a schedule and gates nothing.
      - ".github/workflows/canary.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/dco.yml"
      - ".github/workflows/docs-pins.yml"
      - ".github/workflows/issue-template-guard.yml"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      include_arm64:
        description: "Also build linux/arm64 (multi-arch). Leave off for amd64-only."
        type: boolean
        default: false

# A fast follow-up push to main supersedes the in-flight image build for
# that ref. main itself is not cancelled — every main commit yields its
# own immutable sha- tag so a deploy can pin any of them.
concurrency:
  group: release-image-${{ github.ref }}
  # Cancel a superseded build immediately, including on main — only the latest
  # commit's image is deployed, so an older in-flight build is wasted minutes.
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Pick the architectures to build: amd64 always; arm64 on a v* tag, because a
  # release is what people pull by version and ARM nodes are common, plus on a
  # manual run that opts in. Emitted as a matrix the build job consumes via
  # fromJSON.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: pick architectures
        id: pick
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          OPT_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.include_arm64 }}
        run: |
          amd64='{"platform":"linux/amd64","runner":"ubuntu-latest"}'
          arm64='{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}'
          if [ "$IS_TAG" = "true" ] || [ "$OPT_IN" = "true" ]; then
            echo "matrix={\"include\":[$amd64,$arm64]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$amd64]}" >> "$GITHUB_OUTPUT"
          fi

  # One job per selected architecture, each on a native runner. Builds and
  # pushes an untagged image by digest only; the merge job assembles the tags.
  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push to GHCR via the job's GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7

      # The image build exceeds the runner's ~14 GB; drop unused preinstalled toolchains to reclaim space.
      - name: reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost
          df -h /

      - name: derive a filesystem-safe arch tag
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - name: log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          # AGPL-3.0 §13 source-offer identity baked into the binary.
          # Ship the browser engine on a glibc base so a flow-capable agent can
          # run real flows (v8 needs glibc); the brain + non-flow agents carry
          # it unused, gated off by flow.enabled.
          build-args: |
            SM_SOURCE_COMMIT=${{ github.sha }}
            SM_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            WITH_LIGHTPANDA=true
            FINAL_IMAGE=gcr.io/distroless/cc-debian12:nonroot
          labels: ${{ steps.meta.outputs.labels }}
          # Push the arch image with no tag; the merge job references it by
          # digest. name-canonical keeps the digest tied to the final repo name.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # cargo-chef splits the slow dependency layer from the app layer; the
          # gha layer cache makes unchanged-deps rebuilds cheap. Scope per arch
          # so the two matrix legs don't clobber each other's cache.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          # No SLSA provenance attestation: it injects extra manifests that
          # complicate the imagetools merge below for no benefit here.
          provenance: false

      - name: export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one manifest list and apply the real tags.
  # This is the only job that publishes a pullable tag.
  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: inspect published image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
