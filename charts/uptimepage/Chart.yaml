apiVersion: v2
name: uptimepage
description: Self-hosted uptime monitoring, incidents, and status pages
type: application
version: 0.8.0
appVersion: "1.5.0"
# `-0` so vendor builds (v1.31.1-gke.x) satisfy the constraint.
kubeVersion: ">=1.29.0-0"
home: https://uptimepage.dev
icon: https://uptimepage.dev/static/img/org-icon.png
sources:
  - https://github.com/uptimepage/uptimepage
keywords:
  - uptime
  - monitoring
  - status-page
  - incidents
  - sre
maintainers:
  - name: uptimepage contributors
    url: https://github.com/uptimepage/uptimepage
annotations:
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "true"
  artifacthub.io/links: |
    - name: Documentation
      url: https://uptimepage.dev/docs
    - name: Source
      url: https://github.com/uptimepage/uptimepage
  # Artifact Hub scans what it finds here, so it has to track appVersion.
  artifacthub.io/images: |
    - name: uptimepage
      image: ghcr.io/uptimepage/uptimepage:1.5.0
  artifacthub.io/screenshots: |
    - title: Monitor dashboard
      url: https://uptimepage.dev/static/marketing/uptime-monitoring-dashboard.webp
    - title: Monitors list
      url: https://uptimepage.dev/static/marketing/uptime-monitors-list.webp
    - title: Latency by region
      url: https://uptimepage.dev/static/marketing/monitor-latency-by-region.webp
    - title: Notification channels
      url: https://uptimepage.dev/static/marketing/notification-channels-slack-pagerduty-sms.webp
    - title: Adding a notification channel
      url: https://uptimepage.dev/static/marketing/add-notification-channel.webp
    - title: Public status page
      url: https://uptimepage.dev/static/marketing/public-status-page.webp
    - title: Status page day history
      url: https://uptimepage.dev/static/marketing/blog-maintenance-day.webp
  artifacthub.io/changes: |
    - kind: changed
      description: Tracks application 1.5.0
    - kind: added
      description: Artifact Hub screenshots of the dashboard, channels, status page and day history
    - kind: changed
      description: The ingress proxy timeout defaults to 150s so a test or check-now (up to 145s) is no longer cut off, and the schema refuses less, so an upgrade that pins a lower value fails until you raise it
    - kind: changed
      description: Probe pods get 180s to finish a test or check-now in flight on shutdown
    - kind: changed
      description: The values file asks for a read inbox as the sender address
    - kind: fixed
      description: Numeric settings reach the app as plain integers, so a value of 1000000 or more no longer renders as 1e+06
