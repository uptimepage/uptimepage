apiVersion: v2
name: uptimepage
description: Self-hosted uptime monitoring, incidents, and status pages
type: application
version: 0.5.2
appVersion: "1.3.0"
# `-0` so vendor builds (v1.31.1-gke.x) satisfy the constraint.
kubeVersion: ">=1.29.0-0"
home: https://uptimepage.dev
icon: https://uptimepage.dev/static/img/org-icon.png
sources:
  - https://github.com/uptimepage/uptimepage
keywords:
  - uptime
  - monitoring
  - status-page
  - incidents
  - sre
maintainers:
  - name: uptimepage contributors
    url: https://github.com/uptimepage/uptimepage
annotations:
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "true"
  artifacthub.io/links: |
    - name: Documentation
      url: https://uptimepage.dev/docs
    - name: Source
      url: https://github.com/uptimepage/uptimepage
  # Artifact Hub scans what it finds here, so it has to track appVersion.
  artifacthub.io/images: |
    - name: uptimepage
      image: ghcr.io/uptimepage/uptimepage:1.3.0
  artifacthub.io/screenshots: |
    - title: Monitor dashboard
      url: https://uptimepage.dev/static/marketing/uptime-monitoring-dashboard.webp
    - title: Monitors list
      url: https://uptimepage.dev/static/marketing/uptime-monitors-list.webp
    - title: Public status page
      url: https://uptimepage.dev/static/marketing/public-status-page.webp
  artifacthub.io/changes: |
    - kind: changed
      description: The values file asks for a read inbox as the sender address; templates are unchanged
