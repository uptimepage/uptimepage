apiVersion: v2
name: uptimepage-agent
description: Regional probe agent for an Uptimepage control plane, hosted or self-hosted
type: application
version: 0.3.2
appVersion: "1.3.0"
# `-0` so vendor builds (v1.31.1-gke.x) satisfy the constraint.
kubeVersion: ">=1.29.0-0"
home: https://uptimepage.dev
icon: https://uptimepage.dev/static/img/org-icon.png
sources:
  - https://github.com/uptimepage/uptimepage
keywords:
  - uptime
  - monitoring
  - private-location
  - probe
  - sre
maintainers:
  - name: uptimepage contributors
    url: https://github.com/uptimepage/uptimepage
annotations:
  artifacthub.io/license: AGPL-3.0-only
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "true"
  artifacthub.io/links: |
    - name: Documentation
      url: https://uptimepage.dev/docs/kubernetes
    - name: Source
      url: https://github.com/uptimepage/uptimepage
  # Artifact Hub scans what it finds here, so it has to track appVersion.
  artifacthub.io/images: |
    - name: uptimepage
      image: ghcr.io/uptimepage/uptimepage:1.3.0
  artifacthub.io/screenshots: |
    - title: Latency by region
      url: https://uptimepage.dev/static/marketing/monitor-latency-by-region.webp
  artifacthub.io/changes: |
    - kind: changed
      description: Tracks application 1.3.0; the chart templates are unchanged
