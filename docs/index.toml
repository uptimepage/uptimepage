# The documentation's table of contents: one [[page]] per Markdown file under
# docs/, in the order readers see within each section. The site builds its
# routes, sidebar, sitemap and llms.txt from this file, so a new page is one
# Markdown file plus one entry here.
#
# slug         the file's path under docs/ without ".md"; also its URL under /docs
# description  the search snippet, 150-160 characters
# blurb        the line under the title on the index, at most 110 characters
# section      start, guide, reference, hosted or self-hosting
# scope        everyone, hosted or self-hosting: who the page is written for
# created      first published; never after lastmod
# lastmod      the date of the page's last change, checked against git on commit

