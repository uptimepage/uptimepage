# Dev stack. Two modes:
#
# 1. Native binary (default — fastest, ~3 s incremental):
#       docker compose -f compose.dev.yml up -d
#       cargo run --bin uptimepage
#    config/default.toml already points at localhost:5432 and localhost:8123.
#
# 2. uptimepage inside docker with live reload (cargo-watch, ~3 s after
#    the first warm-up; rebuilds happen in-container against a cached target/):
#       docker compose -f compose.dev.yml --profile dev-app up -d --build
#       docker compose -f compose.dev.yml logs -f uptimepage
#    Don't run both modes at once — port 8080 will conflict.
#
# Tear down (keeps volumes):
#   docker compose -f compose.dev.yml down
# Tear down + wipe data:
#   docker compose -f compose.dev.yml down -v
name: uptimepage
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: monitor
      CLICKHOUSE_USER: monitor
      CLICKHOUSE_PASSWORD: monitor
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data_dev:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Live-reload container. Opt in via `--profile dev-app`. Bind-mounts the
  # repo so `cargo watch` sees host edits; named volumes for target/, the
  # cargo registry, and bin/ so build artefacts and the linux Tailwind CLI
  # never collide with host (macOS) equivalents.
  uptimepage:
    profiles: ["dev-app"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
    # Local secrets (payment provider keys); the long form needs Compose 2.24+.
    env_file:
      - path: .env
        required: false
    environment:
      UPTIMEPAGE_STORAGE__POSTGRES__URL: postgres://monitor:monitor@postgres:5432/monitor
      UPTIMEPAGE_STORAGE__CLICKHOUSE__URL: http://clickhouse:8123
      UPTIMEPAGE_STORAGE__CLICKHOUSE__USER: monitor
      UPTIMEPAGE_STORAGE__CLICKHOUSE__PASSWORD: monitor
      UPTIMEPAGE_STORAGE__ALLOW_DEFAULT_CREDENTIALS: "true"
      # Dev mirrors the prod deployment: per-subdomain public pages.
      # Seed a session with `just dev-login` (scripts/seed-dev-session.sh).
      # lvh.me resolves *.lvh.me -> 127.0.0.1 so {slug}.lvh.me:8080 hits the
      # local stack with no /etc/hosts surgery.
      UPTIMEPAGE_TENANCY__PATH_BASED_PUBLIC_ROUTES: "false"
      UPTIMEPAGE_TENANCY__SUBDOMAIN_PUBLIC_ROUTES: "true"
      UPTIMEPAGE_PUBLIC_STATUS__BASE_DOMAIN: "lvh.me"
      # Marketing site on apex (lvh.me) + www.lvh.me. Disabled in prod
      # default; enabled here so visual changes can be inspected at
      # http://lvh.me:8080. Canonical/app URLs point at the prod hosts
      # because the validator requires https — the page renders fine,
      # only the canonical/OG meta tags reference the prod URLs.
      UPTIMEPAGE_MARKETING__ENABLED: "true"
      UPTIMEPAGE_MARKETING__APP_URL: "https://app.uptimepage.dev"
      UPTIMEPAGE_MARKETING__CANONICAL_ORIGIN: "https://uptimepage.dev"
      # Tenancy boot guards: ip/ua fingerprint salt is mandatory under SaaS.
      # Fixed dev-only value — never used outside the local stack.
      UPTIMEPAGE_AUTH__FINGERPRINT_SALT: "dev-only-fingerprint-salt-not-for-prod"
      # Browser drops `Secure` cookies over plain HTTP; dev runs HTTP on lvh.me.
      UPTIMEPAGE_AUTH__SESSION__COOKIE_SECURE: "false"
      # MCP server on. OAuth stays OFF in dev: the boot guard requires the
      # issuer/resource to be https (or loopback http), and `app.lvh.me` is
      # neither — enabling it would panic on boot. Test read+write tools with a
      # static org-bound token (Settings → API tokens) via Claude Desktop /
      # mcp-remote pointed at http://app.lvh.me:8080/mcp.
      UPTIMEPAGE_MCP__ENABLED: "true"
      # Operator surface (/operator/*) for the local multi-region harness:
      # mint regions + agent tokens. Off in prod unless a token is set; this
      # fixed dev value is never used outside the local stack. Drives
      # `just dev-regions` (scripts/dev-regions.sh).
      UPTIMEPAGE_OPERATOR__ADMIN_TOKEN: "dev-operator-token"
      # Provider stays "log", so mail renders to tracing. The from address
      # gives the operator-domain block a domain; the support address mounts /help.
      UPTIMEPAGE_EMAIL__FROM_ADDRESS: "hello@example.invalid"
      UPTIMEPAGE_EMAIL__SUPPORT_ADDRESS: "hello@example.invalid"
      UPTIMEPAGE_OBSERVABILITY__LOG_FORMAT: json
      UPTIMEPAGE_OBSERVABILITY__LOG_LEVEL: "uptimepage=debug,sqlx=warn,hyper=warn,tower_http=info,info"
      UPTIMEPAGE_SERVER__API_BIND: "0.0.0.0:8080"
      UPTIMEPAGE_SERVER__METRICS_BIND: "0.0.0.0:9090"
      # Dashboard mode: the control plane is a pure brain — it ingests, detects,
      # and alerts but does NOT probe in-process. Every region is covered by a
      # real agent (`just dev-regions`), so region liveness is uniform and
      # silence detection works without a phantom in-process region. The home
      # region is co-located: the dev-regions agent for `eu-helsinki` plays the
      # same role the Hetzner-box agent plays in prod.
      UPTIMEPAGE_SCHEDULER__ENABLED: "false"
      UPTIMEPAGE_SCHEDULER__REGION: "eu-helsinki"
      UPTIMEPAGE_SCHEDULER__DEFAULT_REGION: "eu-helsinki"
      # Incremental compilation keeps cargo-watch rebuilds fast: a template or
      # code edit recompiles only the changed codegen units, not the whole
      # crate. mold (via the bind-mounted .cargo/config.toml musl target) links
      # it. Incremental is mutually exclusive with sccache, and only deps —
      # never the local crate — were cacheable, so incremental wins for the
      # edit-recompile loop.
      CARGO_INCREMENTAL: "1"
    volumes:
      - .:/usr/src/uptimepage
      - cargo_registry_dev:/usr/local/cargo/registry
      - target_cache_dev:/usr/src/uptimepage/target
      # Mask host bin/ so build.rs fetches the linux/alpine tailwindcss.
      - tailwind_bin_dev:/usr/src/uptimepage/bin
    ports:
      - "8080:8080"
      - "9090:9090"

volumes:
  pg_data_dev:
  ch_data_dev:
  cargo_registry_dev:
  target_cache_dev:
  tailwind_bin_dev:
