# cargo-deny config — license / advisory / ban / source policy.
# Schema reference: https://embarkstudios.github.io/cargo-deny/checks/index.html
#
# The CI workflow runs:
#   cargo-deny check advisories bans licenses sources
#
# Local invocation: `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ── Advisories: RustSec database lookup. ────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# CI fails on any known vulnerability or unmaintained crate by default.
# Each ignored advisory MUST carry a comment explaining (a) which crate it
# affects, (b) why we can't migrate yet, and (c) when to revisit. Revisit
# this list whenever a major dep bump lands.
ignore = [
    # `backoff` — unmaintained. Pulled in via opentelemetry-otlp's retry path;
    # no first-party replacement upstream yet. Revisit on next opentelemetry
    # bump.
    "RUSTSEC-2025-0012",
    # `instant` — unmaintained shim for wasm `Instant`. Transitive via
    # `fastrand`/`parking_lot` test helpers. No action available; will drop
    # out as those crates migrate to `web-time`.
    "RUSTSEC-2024-0384",
    # `paste` — author archived; transitive via `clickhouse` (polonius-the-crab)
    # and `utoipa-axum`. No safe upgrade; replacements (`pastey`,
    # `with_builtin_macros`) require upstream PRs. Revisit on clickhouse
    # 0.16 / utoipa-axum 0.3.
    "RUSTSEC-2024-0436",
    # `basic-toml` — archived, unmaintained. Compiled into the askama_derive
    # proc-macro through askama's default `config` feature, which path-based
    # templates need; it runs only at compile time and is not in the binary.
    # The latest askama (0.16.1) still depends on it. Revisit when
    # askama_derive drops or replaces basic-toml.
    "RUSTSEC-2026-0374",
    # `rustls-pemfile` — archived in favour of `rustls-pki-types::pem`.
    # Dev-dep-only (test cert helpers); harmless. Revisit when test deps
    # migrate.
    "RUSTSEC-2025-0134",
    # `rsa` — timing sidechannel leaking an RSA private key. Transitive via
    # webauthn-rs-core; a relying party only verifies, so we hold no RSA
    # private key for it to leak. No upgrade exists. Revisit on webauthn-rs
    # 0.6 stable.
    "RUSTSEC-2023-0071",
    # `crypto-bigint` 0.5: secret-dependent branches in arithmetic meant to be
    # constant-time. Transitive via webauthn-rs-core's elliptic-curve 0.13,
    # which only verifies passkey signatures against public keys, so no secret
    # passes through it. Only 0.7.6 is patched, and webauthn-rs reaches it
    # through crypto-glue 0.2, unreleased. Revisit on the next webauthn-rs
    # publish.
    "RUSTSEC-2026-0387",
    # `zip` 3 — symlink targets and SUID bits on `extract()`. Build-only, via
    # utoipa-swagger-ui's build script, which never calls `extract()`: it
    # writes the regular files of the pinned Swagger UI release archive into
    # OUT_DIR. Nothing unzips at runtime. utoipa-swagger-ui 10 still requires
    # zip 8; revisit when juhaku/utoipa#1645 (zip 9) ships in a release.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

# ── Licenses: explicit allow-list. Anything outside the list fails CI. ──────
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "OpenSSL",
    "CC0-1.0",
]
confidence-threshold = 0.93
exceptions = []
# The allow-list governs *dependencies*. The workspace crate itself is
# AGPL-3.0-or-later and `publish = false`; `private.ignore` skips
# unpublished workspace members so our own copyleft license is not graded
# against the (permissive) dependency policy.
private = { ignore = true }

# ── Bans: duplicate-version + crate-level deny. ─────────────────────────────
[bans]
# Two-major-versions-of-the-same-crate doubles binary size and slows
# compile. Warn until duplicates are pruned; flip to "deny" later.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []

# Duplicates we can't easily resolve yet — keep the warning quiet so
# real ones surface. Each entry should carry a comment explaining why.
skip = []
skip-tree = []

# ── Sources: only crates.io + the listed git remotes. ───────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
