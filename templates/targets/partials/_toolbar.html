<form id="monitors-filter"
      role="search"
      aria-label="Filter monitors"
      hx-get="/targets"
      hx-select="#target-rows"
      hx-target="#target-rows"
      hx-swap="outerHTML"
      hx-push-url="true"
      hx-trigger="change, keyup delay:300ms from:input[name='q']"
      class="monitors-toolbar">
  <label class="monitors-search" for="monitors-search">
    <svg class="monitors-search__icon" aria-hidden="true"><use href="#i-search" /></svg>
    {# `hx-preserve` keeps the cursor across #target-rows swaps. #}
    <input id="monitors-search" name="q" type="search" value="{{ q }}"
           placeholder="Search by name, host, tag…"
           hx-preserve="true"
           class="monitors-search__input">
    <span class="monitors-search__keyhint" aria-hidden="true">/</span>
  </label>

  <div class="sm-rail" role="tablist" aria-label="Type filter">
    {% for chip in type_chips %}
    <a href="/targets?{{ chip.query }}"
       hx-get="/web/targets/list?{{ chip.query }}"
       hx-target="#target-rows"
       hx-swap="outerHTML"
       hx-push-url="/targets?{{ chip.query }}"
       class="sm-rail__seg{% if chip.active %} sm-rail__seg--active{% endif %}"
       role="tab"
       aria-selected="{% if chip.active %}true{% else %}false{% endif %}">
      {{ chip.label }}
      <span class="sm-rail__count">{{ chip.count }}</span>
    </a>
    {% endfor %}
  </div>

  <div class="monitors-toolbar__right">
    <span class="sm-filter sm-filter--seg"><select name="enabled" data-sm-combobox class="monitors-toolbar__select" aria-label="State">
      <option value=""{% if enabled.is_none() %} selected{% endif %}>state:any</option>
      <option value="true"{% if enabled == Some(true) %} selected{% endif %}>state:enabled</option>
      <option value="false"{% if enabled == Some(false) %} selected{% endif %}>state:paused</option>
    </select></span>

    <span class="sm-filter sm-filter--seg"><select name="owner" data-sm-combobox class="monitors-toolbar__select" aria-label="Owner">
      <option value=""{% if owner.is_none() %} selected{% endif %}>owner:any</option>
      {% for opt in owner_options %}
      <option value="{{ opt.id }}"{% if opt.selected %} selected{% endif %}>owner:{{ opt.label }}</option>
      {% endfor %}
    </select></span>

    <span class="sm-filter sm-filter--seg"><select name="group" data-sm-combobox class="monitors-toolbar__select" aria-label="Group">
      <option value=""{% if group == "" %} selected{% endif %}>group:any</option>
      {% for opt in group_options %}
      <option value="{{ opt.name }}"{% if opt.selected %} selected{% endif %}>group:{{ opt.name }}</option>
      {% endfor %}
    </select></span>

    <span class="sm-filter sm-filter--seg"><select name="sort" data-sm-combobox class="monitors-toolbar__select" aria-label="Sort">
      <option value="recent"{% if sort == "recent" %} selected{% endif %}>sort:recent</option>
      <option value="name"{% if sort == "name" %} selected{% endif %}>sort:name</option>
      <option value="created"{% if sort == "created" %} selected{% endif %}>sort:created</option>
    </select></span>

    {# Chip clicks bypass this form (anchor + hx-get) so no double-submit. #}
    <input type="hidden" name="kind" value="{{ kind }}">
    <input type="hidden" name="tag"  value="{{ tag }}">
  </div>
</form>
