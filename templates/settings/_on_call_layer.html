{# One rotation layer in the schedule builder, shared by the rendered rows and
   the clone <template> for a new one. #}
{% macro layer(layer, members, num) %}
<div data-layer-row class="sticker-card space-y-4 p-4">
  <div class="flex items-center justify-between">
    <h3 class="text-sm font-medium">layer <span data-layer-num>{{ num }}</span></h3>
    <button type="button" data-remove-layer class="row-link row-link--danger text-xs">remove</button>
  </div>
  <label class="field-outline max-w-xs">
    <span class="field-outline__label">Label <span class="text-quiet">(optional)</span></span>
    <input type="text" data-layer-name maxlength="100" value="{{ layer.name }}" class="w-full field">
  </label>
  <div class="flex flex-wrap gap-4">
    <label class="field-outline">
      <span class="field-outline__label">Rotation</span>
      <select data-rotation-type class="field">
        <option value="daily"{% if layer.rotation_type == "daily" %} selected{% endif %}>Daily</option>
        <option value="weekly"{% if layer.rotation_type == "weekly" %} selected{% endif %}>Weekly</option>
        <option value="custom"{% if layer.rotation_type == "custom" %} selected{% endif %}>Custom</option>
      </select>
    </label>
    <label class="field-outline">
      <span class="field-outline__label">Every</span>
      <span class="flex items-center gap-2">
        <input type="text" data-rotation-length value="{{ layer.rotation_length }}" autocomplete="off" spellcheck="false" class="w-24 field">
        <span data-rotation-unit class="text-sm text-muted"></span>
      </span>
    </label>
    <label class="field-outline">
      <span class="field-outline__label">First handoff <span data-handoff-zone class="font-mono text-quiet"></span></span>
      <input type="datetime-local" data-handoff value="{{ layer.handoff_local }}" data-iso="{{ layer.handoff_at }}" class="field">
    </label>
  </div>
  <div class="space-y-2">
    <span class="block text-xs uppercase text-muted">Participants, in rotation order</span>
    <ol data-participant-list class="space-y-1">
      {% for p in layer.participants %}
      {% call participant(p.id, p.email, p.reachable) %}{% endcall %}
      {% endfor %}
    </ol>
    <div class="flex flex-wrap items-center gap-2">
      <select data-add-participant class="field max-w-xs" aria-label="Member to add">
        <option value="">choose a member…</option>
        {% for m in members %}
        <option value="{{ m.id }}" data-email="{{ m.email }}"{% if !m.reachable %} data-unreachable{% endif %}>{{ m.email }}{% if !m.reachable %} (no paging channels){% endif %}</option>
        {% endfor %}
      </select>
      <button type="button" data-add-participant-go class="sticker-btn px-3 py-1 text-sm">add</button>
    </div>
  </div>
</div>
{% endmacro %}

{% macro participant(id, email, reachable) %}
<li data-participant="{{ id }}" class="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm">
  <span data-participant-pos class="w-5 text-right font-mono text-xs text-quiet"></span>
  <span data-participant-email class="min-w-0 truncate">{{ email }}</span>
  <span data-participant-unreachable class="flash-text flash-text--warn text-xs"{% if reachable %} hidden{% endif %}>no paging channels</span>
  <span class="ml-auto flex items-center gap-2">
    <button type="button" data-move="-1" class="row-link text-xs" aria-label="Move {{ email }} earlier">up</button>
    <button type="button" data-move="1" class="row-link text-xs" aria-label="Move {{ email }} later">down</button>
    <button type="button" data-remove-participant class="row-link row-link--danger text-xs" aria-label="Remove {{ email }}">remove</button>
  </span>
</li>
{% endmacro %}
