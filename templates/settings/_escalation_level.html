{% import "_register.html" as reg %}
{# One level in the escalation-policy builder, shared by the rendered rows and
   the clone <template> for a new one. #}
{% macro level(level, num) %}
<fieldset data-level-row class="sticker-card form-card min-w-0 scroll-mt-6">
  <legend>
    <span class="flex items-center gap-2">
      <span class="flex-1">level <span data-level-num>{{ num }}</span></span>
      <button type="button" data-remove-level class="row-link row-link--danger text-xs font-normal normal-case tracking-normal">remove</button>
    </span>
  </legend>
  <div class="clear-both space-y-5 p-5">
    <div data-delay-field>
      <span data-delay-label class="mb-1.5 block text-xs text-muted">Wait before next level</span>
      <div class="flex flex-wrap items-center gap-2">
        <div class="sm-rail" role="radiogroup" aria-label="Wait">
          {% for p in level.delay_presets() %}
          <label class="sm-rail__seg">
            <input type="radio" data-delay-preset value="{{ p }}" class="sr-only"{% if level.delays_after(p) %} checked{% endif %}>{{ p }}
          </label>
          {% endfor %}
          <label class="sm-rail__seg">
            <input type="radio" data-delay-preset value="custom" class="sr-only"{% if level.custom_delay() %} checked{% endif %}>custom
          </label>
        </div>
        <input type="text" data-delay value="{{ level.delay }}" placeholder="45m" aria-label="Custom wait"
               autocomplete="off" spellcheck="false" class="w-24 field font-mono"{% if !level.custom_delay() %} hidden{% endif %}>
      </div>
      <p data-delay-unused hidden class="mt-1 font-mono text-xs text-quiet"># only used when the ladder is walked again</p>
    </div>
    <div data-level-channels>
      <span class="mb-1.5 block text-xs text-muted">Channels paged at this level</span>
      {% if level.channels.is_empty() %}
      <p class="font-mono text-xs text-quiet"># no notification channels yet</p>
      {% else %}
      <div class="flex flex-wrap items-center gap-1.5" role="group" aria-label="Channels paged at this level">
        {% for ch in level.channels %}
        <label class="scope-token">
          <input type="checkbox" data-channel value="{{ ch.id }}" class="sr-only"{% if ch.selected %} checked{% endif %}>
          {{ ch.name }}
        </label>
        {% endfor %}
      </div>
      {% endif %}
    </div>
    {% if !level.schedules.is_empty() %}
    <div data-level-schedules>
      <span class="mb-1.5 block text-xs text-muted">On-call schedules paged at this level</span>
      <div class="flex flex-wrap items-center gap-1.5" role="group" aria-label="On-call schedules paged at this level">
        {% for sc in level.schedules %}
        <label class="scope-token">
          <input type="checkbox" data-schedule value="{{ sc.id }}" class="sr-only"{% if sc.selected %} checked{% endif %}>
          {{ sc.name }}
        </label>
        {% endfor %}
      </div>
    </div>
    {% endif %}
    {% if !level.people.is_empty() %}
    <div class="space-y-1.5">
      <span class="block text-xs text-muted">People paged at this level</span>
      <ul class="space-y-1.5">
        {% for p in level.people %}
        <li data-person="{{ p.id }}" class="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-sm border border-[color:var(--theme-line)] py-1 pl-2 pr-1 text-sm">
          <span class="min-w-0 truncate">{{ p.email }}</span>
          {% if !p.reachable %}<span class="flash-text flash-text--warn text-xs">no paging channels</span>{% endif %}
          <span class="ml-auto">{% call reg::row_remove("data-remove-person", "Stop paging {} at this level"|format(p.email)) %}{% endcall %}</span>
        </li>
        {% endfor %}
      </ul>
      <p class="font-mono text-xs text-quiet"># set through the API; saving here keeps the ones still listed</p>
    </div>
    {% endif %}
  </div>
</fieldset>
{% endmacro %}
