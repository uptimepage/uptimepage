<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f9fafb">
    <title>Not Found | Uptimepage</title>
    <meta name="description" content="The page you requested does not exist.">
    <link rel="canonical" href="{{ canonical_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ "img/favicon.svg"|asset }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "img/favicon.png"|asset }}">
    <link rel="apple-touch-icon" href="{{ "img/apple-touch-icon.png"|asset }}">
    <link rel="stylesheet" href="{{ "css/marketing.css"|asset }}">
    <meta name="robots" content="noindex">
    {% include "marketing/_analytics.html" %}
    {# Inert without the tracker above, so it needs no second copy of its gate. #}
    <script defer src="{{ "js/marketing/not_found.js"|asset }}"></script>
</head>
<body class="marketing-shell antialiased">
    <main class="container mx-auto max-w-xl px-4 py-24 text-center">
        <p class="mk-eyebrow mk-eyebrow--ok mb-4">HTTP/2 404</p>
        <h1 class="mk-display mk-display--xl">
            <span class="mk-display-em">no route</span> matched.
        </h1>
        <p class="mk-lede mx-auto mt-5">
            The page you requested does not exist. It may have moved, or it may
            never have been here.
        </p>
        <div class="mt-8">
            <a href="/" class="mk-cta mk-cta--primary">
                back to home
                <svg class="mk-cta__arrow h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 12h15"/>
                </svg>
            </a>
        </div>
    </main>
</body>
</html>
