{# Directory badges, one set only: the marquee copies are cloned at runtime, so
   a new listing is one <a> here. Images must be local files, the marketing CSP
   is img-src 'self'. #}
<div class="mk-badges min-w-0 flex-1 self-center" data-badge-rail>
    <div class="mk-badges__viewport">
        <div class="mk-badges__track">
            <div class="mk-badges__set">
                <a class="mk-badges__item" href="https://postyourstartup.co/startup/uptimepage?ref=badge" rel="noopener" target="_blank">
                    <img src="{{ "marketing/postyourstartup.svg"|asset }}" width="170" height="44" alt="Featured on PostYourStartup" loading="lazy" decoding="async">
                </a>
                <a class="mk-badges__item" href="https://fazier.com/launches/uptimepage.dev" rel="noopener" target="_blank">
                    <img src="{{ "marketing/fazier-badge.svg"|asset }}" width="103" height="44" alt="Launched on Fazier" loading="lazy" decoding="async">
                </a>
                <a class="mk-badges__item" href="https://www.uneed.best/tool/uptimepage" rel="noopener" target="_blank">
                    <img src="{{ "marketing/uneed-badge.png"|asset }}" width="134" height="44" alt="Featured on Uneed" loading="lazy" decoding="async">
                </a>
                <a class="mk-badges__item" href="https://wired.business" rel="noopener" target="_blank">
                    <img src="{{ "marketing/wired-business.svg"|asset }}" width="163" height="44" alt="Featured on Wired Business" loading="lazy" decoding="async">
                </a>
                <a class="mk-badges__item" href="https://unitelist.com/product/uptimepage" rel="noopener" target="_blank">
                    <img src="{{ "marketing/unitelist-badge.png"|asset }}" width="135" height="44" alt="Featured on Unite List" loading="lazy" decoding="async">
                </a>
                <a class="mk-badges__item" href="https://maidensail.com/startup/uptimepage" rel="noopener" target="_blank">
                    <img src="{{ "marketing/maidensail-badge.svg"|asset }}" width="190" height="44" alt="Featured on Maidensail" loading="lazy" decoding="async">
                </a>
                <a class="mk-badges__item" href="https://fwfw.app/item/uptimepage" rel="noopener" target="_blank">
                    <img src="{{ "marketing/fwfw-badge.svg"|asset }}" width="204" height="44" alt="Featured on FWFW" loading="lazy" decoding="async">
                </a>
            </div>
        </div>
    </div>
</div>
