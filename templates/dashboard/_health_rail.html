<section class="sticker-card dashboard-rail" aria-label="Status breakdown">
  <div class="dashboard-rail__cell">
    <p class="dashboard-rail__label">
      <span class="dashboard-dot dashboard-dot--up"></span>
      up
    </p>
    <p class="dashboard-rail__value{% if status_counts.up == 0 %} dashboard-rail__value--muted{% endif %}">
      {{ status_counts.up }}
    </p>
  </div>
  <div class="dashboard-rail__cell">
    <p class="dashboard-rail__label">
      <span class="dashboard-dot dashboard-dot--degraded"></span>
      degraded
    </p>
    <p class="dashboard-rail__value{% if status_counts.degraded == 0 %} dashboard-rail__value--muted{% endif %}">
      {{ status_counts.degraded }}
    </p>
  </div>
  <div class="dashboard-rail__cell">
    <p class="dashboard-rail__label">
      <span class="dashboard-dot dashboard-dot--down"></span>
      down
    </p>
    <p class="dashboard-rail__value{% if status_counts.down == 0 %} dashboard-rail__value--muted{% endif %}">
      {{ status_counts.down }}
    </p>
  </div>
  <div class="dashboard-rail__cell">
    <p class="dashboard-rail__label">
      <span class="dashboard-dot dashboard-dot--muted"></span>
      paused
    </p>
    <p class="dashboard-rail__value{% if status_counts.paused == 0 %} dashboard-rail__value--muted{% endif %}">
      {{ status_counts.paused }}
    </p>
  </div>
  <div class="col-span-2 sm:col-span-4">
    <div class="dashboard-ribbon" role="group" aria-label="Fleet uptime over the last 24 hours; select a dip to filter the monitors below">
      {% for seg in ribbon.segs.iter() %}
      {% if seg.down_targets.is_empty() %}
      <span class="dashboard-ribbon__seg dashboard-ribbon__seg--{{ seg.class }}" data-tip-time="{{ seg.time }}" data-tip-ts="{{ seg.from_iso }}" data-tip-to="{{ seg.to_iso }}" data-tip-stat="{{ seg.stat }}" aria-hidden="true"></span>
      {% else %}
      <button type="button"
              class="dashboard-ribbon__seg dashboard-ribbon__seg--{{ seg.class }} dashboard-ribbon__seg--drill{% if let Some(c) = drill %}{% if c.down_at == seg.bucket_ts %} dashboard-ribbon__seg--active{% endif %}{% endif %}"
              data-tip-time="{{ seg.time }}"
              data-tip-ts="{{ seg.from_iso }}"
              data-tip-to="{{ seg.to_iso }}"
              data-tip-stat="{{ seg.stat }}"
              data-tip-count="{{ seg.down_targets.len() }}"
              aria-pressed="{% if let Some(c) = drill %}{% if c.down_at == seg.bucket_ts %}true{% else %}false{% endif %}{% else %}false{% endif %}"
              aria-label="{{ seg.time }} UTC {{ seg.stat }}, {{ seg.down_targets.len() }} monitor{% if seg.down_targets.len() != 1 %}s{% endif %} down — toggle filter"
              hx-get="/?range={{ range }}{% if let Some(c) = drill %}{% if c.down_at != seg.bucket_ts %}&down_at={{ seg.bucket_ts }}{% endif %}{% else %}&down_at={{ seg.bucket_ts }}{% endif %}{% if let Some(r) = selected_region %}&region={{ r }}{% endif %}{% if let Some(s) = selected_status %}&status={{ s }}{% endif %}{% if let Some(k) = selected_kind %}&type={{ k }}{% endif %}"
              hx-target="#dashboard-table"
              hx-select="#dashboard-table"
              hx-swap="outerHTML"
              hx-push-url="true"><span class="ribbon-seg-names" hidden>{% for n in seg.down_preview.iter() %}<i>{{ n }}</i>{% endfor %}</span></button>
      {% endif %}
      {% endfor %}
    </div>
    <div class="dashboard-ribbon-meta">
      <span class="cli-brackets">24h ago</span>
      <span class="dashboard-ribbon-meta__value">{{ ribbon.uptime_label }}</span>
      <span class="cli-brackets">now</span>
    </div>
  </div>
</section>
