[server]
# Default to loopback. API has no auth in v1; operators must explicitly opt-in
# to non-loopback binds.
api_bind = "127.0.0.1:8080"
metrics_bind = "127.0.0.1:9090"
# Caddy's on-demand TLS `ask` endpoint, for custom status-page domains. Its own
# listener so it is never reachable through the operator host. Empty = off.
custom_domain_ask_bind = ""

[runtime]
worker_threads = 0              # 0 = auto (num_cpus)
max_blocking_threads = 16

[checker]
# In-flight probe cap; each permit is a socket + TLS buffers, so it bounds
# probe memory. Raise per deployment on bigger hosts; overflow fails fast.
max_concurrent_checks = 1024
default_timeout_ms = 10000
connect_timeout_ms = 5000
default_check_interval_secs = 120
# Per-(org, host, port) in-flight cap. Tenant-scoped, fail-fast bulkhead.
per_host_max_inflight = 2
# Process-wide RDAP cap, per-TLD.
rdap_max_inflight = 1

[http_client]
tcp_keepalive_secs = 60
# user_agent defaults to the crate version; set it only to override.

[dns]
cache_size = 50000
positive_ttl_secs = 300
negative_ttl_secs = 60
servers = ["1.1.1.1:53", "8.8.8.8:53"]

[security]
# SSRF guard — see docs/configuration.md.
allow_private_targets = false
# 32-byte KEK base64 (`openssl rand -base64 32`). When empty, basic_auth and
# bearer_token are stored plaintext in check_spec — dev-only.
credentials_kek_base64 = ""
# CIDR ranges whose `X-Forwarded-For` is honoured for client-IP extraction.
# Empty means "no reverse proxy — trust the TCP peer". Behind Caddy / nginx
# / a CDN, set this to the proxy's address ranges (the docker bridge for
# the in-stack Caddy, the CDN's documented IP set for a CDN). Forgetting
# it collapses every `ip_hash` in the DB to the proxy's address — abuse
# indexes useless, magic-link ip_hint shows the proxy.
trusted_proxies = []

[circuit_breaker]
failure_threshold = 5
success_threshold = 2
open_duration_secs = 60
half_open_max_calls = 3

[bootstrap]
# Seeds this owner on first boot, for installs that cannot run the CLI.
email = ""
org_name = "My Org"

[storage]
# The credentials below are published; boot refuses them unless a local stack opts in.
allow_default_credentials = false

[storage.postgres]
url = "postgres://monitor:monitor@localhost:5432/monitor"
max_connections = 16
min_connections = 2
acquire_timeout_secs = 10

[storage.clickhouse]
url = "http://localhost:8123"
database = "monitor"
user = "monitor"
password = "monitor"
batch_size = 1000
batch_timeout_ms = 500
buffer_size = 100000
async_insert = true

[scheduler]
# Off = no in-process probing (pure dashboard); a separate agent covers this
# region. On = this process probes its own region.
enabled = true
target_refresh_interval_secs = 30
# This control plane's region id (override per deployment, e.g. "eu-helsinki").
# A normal region row, not a sentinel — operator renames it to a real location.
region = "default"
# Region new targets are assigned to; empty falls back to `region`.
default_region = ""

[observability]
# Fallback only — tracing reads RUST_LOG first, and the container
# always sets it (compose default `debug`). This governs a bare
# `cargo run` with no RUST_LOG; keep it conservative.
log_level = "info"
log_format = "json"
metrics_enabled = true
tracing_enabled = false
gauge_sample_interval_ms = 1000

# OTLP trace export to Grafana Cloud (or any OTLP/HTTP collector).
# Active only when observability.tracing_enabled AND grafana.enabled are
# both true. api_key is NEVER set here — supply it via the env var
# UPTIMEPAGE_OBSERVABILITY__GRAFANA__API_KEY.
[observability.grafana]
enabled = false
otlp_endpoint = ""           # base, no /v1/traces suffix; e.g.
                             # https://otlp-gateway-<zone>.grafana.net/otlp
instance_id = ""             # Grafana Cloud numeric instance / stack id
trace_sample_ratio = 1.0     # parent-based head sampling; 1.0 = keep all
                             # (low volume — lower when traffic grows)

# External dead-man's-switch. While every critical dependency is reachable the
# app pings `url` every `interval_seconds`; an independent watcher alerts when
# the pings stop. url carries a token — set it via the env var
# UPTIMEPAGE_OBSERVABILITY__HEARTBEAT__URL, never here. interval_seconds must be
# shorter than the watcher's grace period.
[observability.heartbeat]
enabled = false
url = ""
interval_seconds = 60

# Per-IP API rate limiting is enforced by Caddy (see deployment/Caddyfile);
# the in-process limiter is per-org / per-user — see [rate_limits] + plans.

[api.cors]
# Browser CORS for /api/v1/*. Disabled by default. When enabled, every entry in
# `allowed_origins` must be a full origin (scheme://host[:port]); wildcards are
# only honored when `allow_any_origin = true`.
enabled = false
allowed_origins = []
allowed_methods = ["GET", "POST", "PATCH", "DELETE"]
allow_any_origin = false

[tenancy]
# Path-based public surface (`/status/<slug>`, `/api/public/v1/*` on the
# operator host, org resolved from the slug). Set to false in deployments
# that route every public surface through the per-org subdomain.
path_based_public_routes = true
# Wildcard subdomain public surface (`*.{public_status.base_domain}`).
# Set true together with a well-formed `public_status.base_domain` to serve
# per-org status pages on dedicated subdomains.
subdomain_public_routes = false
# Grace period before soft-deleted orgs *and users* are purged. Also the
# account-recovery window; the Privacy Policy quotes this number.
deletion_grace_period_days = 30

# Long-horizon data retention for the daily purge job (runs 03:00 UTC). Every
# key here is bound by the job — no decorative knobs. Windows on a different
# cadence live with their owner and are deliberately NOT repeated here:
#   - oauth_states / magic_link_tokens : own short-cadence security sweeps
#   - expired invitations              : invitations janitor (auth.invitations)
#   - session idle / absolute timeout  : [auth.session]
#   - soft-deleted org/user grace      : tenancy.deletion_grace_period_days
#   - check_results in ClickHouse      : per-row ttl_days stamped from the
#                                        org plan's raw_days at write time
#   - server / app log retention       : Docker log driver
[retention]
login_attempts_days = 180
quota_events_days = 90
audit_log_days = 730              # 2 years
mcp_audit_days = 730              # 2 years
api_tokens_post_expiry_days = 30

# `base_domain` is required when tenancy.subdomain_public_routes = true; the
# startup assertion refuses to boot without it (would let the slug extractor
# match arbitrary Host headers).
[public_status]
base_domain = ""
cache_max_orgs = 1000
cache_ttl_secs = 10
last_good_ttl_secs = 3600
# 1 MiB. Real logos (PNG/JPEG/WebP) routinely exceed 200 KB; the prior
# 204800 cap rejected ordinary uploads. Decode is still bounded by a
# dimension + allocation guard (see status_page::process_logo) so a large
# byte budget is not a decompression-bomb vector.
max_logo_size_bytes = 1048576
allowed_logo_mime_types = ["image/png", "image/jpeg", "image/webp"]
max_logo_dimension_px = 1200
default_brand_color = "#3b82f6"
default_show_powered_by = true
# Second line of defence behind the Caddy-side limit.
public_per_ip_rate_limit_per_min = 60

# Every mail the product sends: sign-in links, invitations, outage alerts,
# status-page subscriber updates, billing notices.
[email]
# "resend" | "log". Dev default is "log" so `cargo run` works with no external
# accounts — action URLs are printed to tracing. ("memory" is the test
# harness buffer and refused at boot.)
provider = "log"
from_name = "Uptimepage"
# Required when provider = "resend". Use an address somebody reads: replies
# and auto-responders to every mail above come back to it, and a no-reply
# sender leaves the recipient the spam button as their only answer.
from_address = ""

# Where the in-app help form delivers. Empty hides it; set only if you staff
# an inbox.
support_address = ""

[email.resend]
# From https://resend.com/api-keys. Required when provider = "resend".
api_key = ""

[billing]
# "paddle" turns on checkout, the webhook receiver at /hooks/billing/paddle,
# the pay page at /pay and the /api/v1/account/billing surface. "none" (the
# default) leaves all of it absent; a self-host install never needs it.
provider = "none"

[billing.paddle]
# "sandbox" or "live". API keys and client tokens are bound to one of them.
environment = "sandbox"
# Env-only in production: UPTIMEPAGE_BILLING__PADDLE__API_KEY and
# UPTIMEPAGE_BILLING__PADDLE__WEBHOOK_SECRET (the notification destination's
# pdl_ntfset_… secret key).
api_key = ""
webhook_secret = ""
# Client-side token Paddle.js initialises with on /pay. Public by design.
client_token = ""

[auth]
# Policy switch per sign-in method. OAuth providers additionally need their
# client credentials + redirect_url set below (list = policy, creds =
# capability); magic_link gates its request/verify routes + purge ticker.
enabled_methods = ["github_oauth", "google_oauth", "microsoft_oauth", "gitlab_oauth", "passkey", "magic_link"]
# Whether an address nobody invited can open an account, and get an org of its
# own. Off makes the deployment invite-only: existing users still sign in, and
# an invitation still bootstraps whoever it names. Needs magic_link, since an
# emailed link is how a stranger proves the address is theirs.
open_signup = true
# Salt for hashing IPs / user-agents in login_attempts + sessions.
# GENERATE WITH: openssl rand -base64 32
# LOAD-BEARING: rotating this re-fragments anomaly-detection windows. The
# startup guard refuses to boot on a mismatch unless
# UPTIMEPAGE_AUTH_ACCEPT_SALT_ROTATION=1 is set.
fingerprint_salt = ""

[auth.session]
idle_timeout_days = 30
absolute_timeout_days = 90
cookie_name = "_sm_session"
cookie_secure = true
cookie_domain = ""
renew_on_use = true

[auth.github]
client_id = ""
client_secret = ""
redirect_url = ""
scopes = ["user:email", "read:user"]

[auth.google]
client_id = ""
client_secret = ""
redirect_url = ""
scopes = ["openid", "email", "profile"]

[auth.microsoft]
client_id = ""
client_secret = ""
redirect_url = ""
scopes = ["openid", "email", "profile"]
# Which Microsoft accounts may sign in: "common" (work, school and personal),
# "organizations" (work and school only), "consumers" (personal only), or a
# tenant GUID / domain to admit exactly one tenant.
tenant = "common"

[auth.gitlab]
client_id = ""
client_secret = ""
redirect_url = ""
scopes = ["openid", "email", "profile"]
# Which GitLab issues the identity: gitlab.com, or a self-managed instance's
# own https origin. It is half the identity key, so changing it after sign-ups
# orphans every account created against the old one.
base_url = "https://gitlab.com"

[auth.invitations]
expiry_hours = 168
# Pending-invitation cap now lives in plans.max_pending_invitations.

[auth.api_tokens]
# Per-user token cap now lives in plans.max_api_tokens_per_user.
# Floor of 16 chars = 48 bits of entropy in the visible prefix (collision-safe
# to ~16M tokens). Startup assertion refuses to boot below that.
prefix_visible_chars = 16

[auth.magic_link]
expiry_minutes = 15
rate_limit_seconds = 60

[quotas]
# Cache TTLs for plan / usage lookups.
plan_cache_ttl_secs = 300
usage_cache_ttl_secs = 10

[rate_limits]
# Per-org / per-user limits come from the plans table. These mirror the
# per-IP numbers Caddy enforces (here for ops parity) and the in-process
# limiter-map janitor cadence.
[rate_limits.per_ip]
public_pages_per_min = 60
auth_endpoints_per_min = 10
org_creations_per_day = 3

[rate_limits.janitor]
cleanup_interval_hours = 6
idle_threshold_hours = 24

[abuse]
# Case-insensitive regex patterns. A target URL matching any of these is
# rejected at creation. Conservative: these are attack-recon paths, never
# legitimate monitoring targets. A customer who genuinely needs one can ask
# support for an exemption.
url_patterns_denied = [
    "/\\.git(/|$)",
    "/\\.env(/|$)",
    "/\\.svn(/|$)",
    "/\\.hg(/|$)",
    "/\\.(DS_Store|htaccess|htpasswd|npmrc|bash_history)(/|$)",
    "/\\.aws/",
    "/\\.ssh/",
    "/phpmyadmin",
    "/(adminer|dbadmin)(\\.php)?",
    "/wp-admin",
    "/wp-login",
    "/wp-config",
    "/xmlrpc\\.php",
    "/cgi-bin/",
    "/vendor/phpunit",
    "/(phpinfo|info)\\.php",
    "/server-(status|info)",
    "/actuator(/|$)",
    "/manager/html",
    "/solr/",
    "/\\.well-known/security\\.txt",
    "/autodiscover/autodiscover\\.xml",
    "\\.(php|jsp|asp|aspx)\\?",
    "\\.(sql|bak|old|swp|dump)(/|$|\\?)",
]
# Domain deny-list (YAML), loaded at startup.
domain_denylist_path = "config/abuse_denylist.yaml"

# Optional hosts-format reputation feed (e.g. a local StevenBlack/hosts
# mirror). Empty = off. Read locally at startup and on the SIGHUP reload —
# never fetched on the check path.
reputation_source_path = ""

# When true, SIGHUP re-reads the patterns / deny-list / reputation feed and
# swaps them in atomically (a malformed edit is rejected, running rules
# stay). When false, deny-list edits need a restart and SIGHUP keeps its OS
# default of terminating the process — stop the server with SIGTERM/SIGINT.
hot_reload_enabled = false

[email_policy]
# Whether an address may open an account or receive mail we send. Two signals:
# membership of a disposable-domain corpus refreshed from the sources below,
# and whether the domain publishes a mail exchanger at all.
#
# Both matter for a different reason than "keep freeloaders out". Mail we send
# to a burner bounces, and bounce rate is a sender-reputation number shared by
# every tenant on the platform — one signup wave to dead domains degrades
# delivery for customers who did nothing wrong.
#
# Off by default, because the MX half asks the resolver in `[dns] servers`,
# which is public. A self-hosted install whose staff mail lives on an internal
# domain would get "no mail exchanger" for every one of its own addresses and
# lock itself out of signup, invitations and email notification channels. Turn
# it on where the addresses you serve are public ones.
enabled = false

# Plain text, one domain per line, `#` comments tolerated. The union is taken.
# Both are rebuilt from upstream continuously: the first is regenerated every
# 24 hours (~75k domains, MIT), the second is curated by pull request (~8k,
# CC0) and is what PyPI uses. Two sources so one going stale or unreachable
# does not leave the corpus frozen.
#
# These lists are third-party data on the signup path. The refresh job refuses
# a candidate that is implausibly small, implausibly large, or a sharp drop
# from the stored one, and `security::email_policy::NEVER_DISPOSABLE` pins
# mainstream mail, privacy relays, and multi-label public suffixes so no
# upstream edit can reach them.
sources = [
    "https://raw.githubusercontent.com/disposable/disposable-email-domains/master/domains.txt",
    "https://raw.githubusercontent.com/disposable-email-domains/disposable-email-domains/main/disposable_email_blocklist.conf",
]

# Matches the faster source's own rebuild cadence. Enforced across replicas by
# an advisory lock, so only one refreshes per interval.
refresh_interval_hours = 24

# What a disposable address does at signup: "flag" opens the account and
# records `users.email_risk`, "block" refuses it, "allow" ignores the signal
# here entirely. Defaults to flag on purpose — the corpus is large enough that
# a false positive is a question of when, and losing a paying customer to one
# costs more than the account it would have stopped. Status-page subscriptions
# and notification destinations are refused regardless of this setting; those
# are the surfaces where a burner turns into a bounce.
signup_policy = "flag"

# Require the domain to publish an MX (or a bare A/AAAA, the implicit exchanger
# of RFC 5321). Catches typos and expired domains no list will ever name. Fails
# open: a resolver timeout is not a verdict, so a DNS blip cannot close signups.
require_mx = true

# Refresh sanity guards. A fetched list outside these bounds is rejected and
# the previous corpus stays live.
min_domains = 5000
max_domains = 500000
max_shrink_pct = 20

[marketing]
# When true, mounts the apex/`www` marketing site + blog. The dispatch
# seam (request/host.rs + marketing/dispatch.rs) routes those hosts to the
# marketing router; every other host stays on the app router. Leave
# false for self-host: the apex is rarely served on a single-box deploy
# and the boot-time invariants will refuse a half-set config.
enabled = false

# CTA + login link target on every marketing page. The marketing module
# never imports app code — this is the only handle it has on the app
# surface, so the extracted service points anywhere with one config
# change. Must be a fully-qualified https URL with no trailing slash.
app_url = ""

# Fully-qualified canonical origin (scheme + host, no trailing slash)
# used for <link rel="canonical">, OG/JSON-LD absolute URLs, and the
# generated sitemap.
canonical_origin = ""

# Subdomain labels that must never alias a tenant slug. Asserted at boot
# to be a subset of `domain::reserved_slugs::RESERVED_SLUGS`. The
# dispatcher already routes apex/`www`/`app` explicitly; this list is a
# belt-and-braces drift guard.
reserved_subdomains = ["www", "app"]

# Mount the /blog routes. The post sources live in
# `src/marketing/content/blog/` and are compiled into the binary.
blog_enabled = true

[mcp]
# Read-only Model Context Protocol server at /mcp (Streamable HTTP). Off by
# default; enable per deployment once the dedicated `mcp.` host + Caddy route
# exist. Auth is a read-only, org-bound, expiring scoped API token.
enabled = false

# Allowed browser origins for the transport's RFC 6454 Origin check
# (DNS-rebinding defense). Empty disables the check; a request with no Origin
# header always passes (non-browser clients like `mcp-remote` send none). Add
# the connector's browser origin(s) here, e.g. ["https://claude.ai"].
allowed_origins = []

# Canonical absolute URI of the /mcp endpoint — the OAuth resource id (RFC 8707
# token audience) and the `resource` in the protected-resource metadata. Empty
# disables OAuth audience binding (static-token mode only).
# e.g. "https://mcp.uptimepage.dev/mcp"
resource_uri = ""

# Enable the OAuth 2.1 authorization-server endpoints that back the one-click
# claude.ai connector. Needs resource_uri + auth.public_base_url set to real
# HTTPS origins. Off by default.
oauth_enabled = false

# Access-token lifetime in seconds (short; the connector auto-renews it with a
# rotating refresh token). The connection lifetime is the user's consent choice.
# Default 1 hour.
access_token_ttl_secs = 3600

[escalation]
# Escalation policies. The incident notifier always runs — incidents page the
# monitor's bound channels on open/resolve regardless of this flag. Enabling it
# adds the policy machinery on top: escalation ladders, on-call schedules, and
# their settings UI.
enabled = false

# How often failed pages are re-attempted.
tick_interval_secs = 15

# Backpressure: max pages re-sent per sweep.
max_pages_per_tick = 500

# Give up paging a channel after this many failed attempts.
max_attempts = 5

# Flag a channel as not delivering after this many deliveries in a row exhaust
# max_attempts, and mail the org's owners once a day at most. The channel is
# never taken off the air for it: a revoked webhook costs a handful of requests
# per incident, while disabling one that was only briefly sick costs the next
# outage. Any send that lands clears the run, as does turning the channel off
# and back on. Set 0 to never flag.
channel_failure_limit = 3

# How far back to look for an incident whose open signal was dropped. A lost
# signal shows up within a tick or two, so anything older is not a dropped
# signal — it is an incident nobody can be paged about.
reconcile_window_secs = 3600

# Flap damping. A monitor opening more than flap_max_opens incidents inside
# flap_window_secs is one unstable endpoint, not that many outages; the crossing
# alert says so and later ones are held. Set flap_max_opens = 0 to deliver all.
flap_window_secs = 3600
flap_max_opens = 5
# A hold is not a drop: an incident still open this many seconds after it was
# held pages anyway, so a monitor that flaps and then stays down is reported.
flap_hold_secs = 600

# Regional probe mode. Off = this process is a normal dashboard. On = it runs
# as a stateless agent: pulls its region's monitor config from control_plane_url
# and ships results back, with no local Postgres/ClickHouse/web/alerting. The
# token carries a capability — set it via UPTIMEPAGE_AGENT__TOKEN, never here.
[agent]
enabled = false
control_plane_url = ""
region = ""
pull_interval_secs = 30
flush_interval_secs = 5
buffer_capacity = 10000

# Operator (instance-admin) surface for managing regions and agents across all
# tenants. Gated by a static bearer secret — set it via UPTIMEPAGE_OPERATOR__ADMIN_TOKEN,
# never here. Empty disables the surface (it 404s).
[operator]
admin_token = ""

# Operator-owned central Telegram bot: customers link a chat by tapping a deep
# link instead of running their own bot. A non-empty bot_token turns on the
# connect button, the /hooks/telegram receiver, and the boot webhook handshake.
# All three values are capabilities — set them via UPTIMEPAGE_TELEGRAM__* env,
# never here. Empty leaves the feature absent; bring-your-own telegram channels
# are unaffected.
[telegram]
bot_token = ""
bot_username = ""
webhook_secret = ""
