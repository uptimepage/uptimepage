# Tuning overrides for the control-plane Postgres. Postgres applies its
# compiled defaults for anything not set here; this file only carries the
# deviations. Loaded via `-c config_file=` (see docker-compose.yml); the data
# directory still comes from the image's PGDATA.
#
# Sizing principle: this instance is co-resident with ClickHouse — the
# memory-heavy data plane that owns the check-result firehose — plus the app and
# the edge proxy on one host. Postgres holds only config/metadata + incidents +
# audit, so its footprint is deliberately bounded to leave headroom for its
# co-tenants rather than following the "25% of RAM" rule for a dedicated box.

#------------------------------------------------------------------------------
# Connections
#------------------------------------------------------------------------------
listen_addresses = '*'           # reachable by the app container; not host-exposed
# A blue/green deploy runs two app instances, each holding up to 18
# (storage.postgres.max_connections + 2 for the email send gate). The rest
# covers a backup and an admin session.
max_connections = 50
# Release a backend (and its pooled connection) pinned by a leaked transaction.
# Only idle-in-transaction sessions are killed; running statements are untouched.
idle_in_transaction_session_timeout = '30s'

#------------------------------------------------------------------------------
# Memory
#------------------------------------------------------------------------------
shared_buffers = 256MB           # bounded so ClickHouse keeps its share of RAM
effective_cache_size = 768MB     # planner hint only (no allocation); OS cache is shared with CH
work_mem = 8MB                   # per sort/hash node; queries here are small point lookups
maintenance_work_mem = 96MB      # transient: vacuum / index build / partition maintenance

#------------------------------------------------------------------------------
# Parallelism — small core count + OLTP point-query workload, so keep it low.
# Parallel scans rarely help our access pattern and steal CPU from co-tenants.
#------------------------------------------------------------------------------
max_parallel_workers_per_gather = 1
max_parallel_workers = 2
max_parallel_maintenance_workers = 1

#------------------------------------------------------------------------------
# Planner — assume SSD/NVMe storage.
#------------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200

#------------------------------------------------------------------------------
# WAL / checkpoints — disk is the binding resource, so bound WAL and spread
# checkpoint writes to avoid I/O spikes contending with ClickHouse merges.
#------------------------------------------------------------------------------
wal_compression = on
min_wal_size = 128MB
max_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
synchronous_commit = on          # config/audit integrity over raw write throughput

#------------------------------------------------------------------------------
# Autovacuum — the partitioned audit tables are append-heavy. Tighter scale
# factors keep dead tuples and stats fresh per partition without waiting for the
# default 20% churn; cost limit raised modestly, capped to spare a small CPU.
#------------------------------------------------------------------------------
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 400

#------------------------------------------------------------------------------
# Resource trims for a shared host
#------------------------------------------------------------------------------
jit = off                        # compile overhead not worth it for point queries
huge_pages = off

#------------------------------------------------------------------------------
# Observability
#------------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_io_timing = on
log_min_duration_statement = 1000ms   # surface slow queries only
log_checkpoints = on
log_autovacuum_min_duration = 0
timezone = 'UTC'
