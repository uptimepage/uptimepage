# Production stack for uptimepage
#
# Layout:
#   Internet → Caddy (TLS, rate-limit) → uptimepage (no public ports)
#                                      → PostgreSQL  (no public ports)
#                                      → ClickHouse  (no public ports)
#
# In SaaS, authentication is enforced by the app (GitHub OAuth session), not
# at the edge (self-host has no operator auth of its own — keep it private).
# Only Caddy publishes ports to the host; everything else is reachable only
# on the internal docker network. This is the single most important
# defense-in-depth property: even if a session is compromised, the databases
# are never exposed.
#
# Required env vars in .env (see .env.example):
#   UPTIMEPAGE_DOMAIN, UPTIMEPAGE_ACME_EMAIL, HETZNER_DNS_API_TOKEN,
#   POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD, UPTIMEPAGE_CREDENTIALS_KEK_BASE64

name: uptimepage

# Docker's json-file driver is unbounded by default. Caddy alone writes
# ~125MB/day of upstream-health noise, so every service caps its log.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  caddy:
    # Custom image: stock caddy:2-alpine lacks the Hetzner DNS-01 solver
    # (wildcard cert) and the rate-limit plugin. Built automatically.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: uptimepage-caddy:3
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      UPTIMEPAGE_DOMAIN: ${UPTIMEPAGE_DOMAIN}
      UPTIMEPAGE_ACME_EMAIL: ${UPTIMEPAGE_ACME_EMAIL}
      HETZNER_DNS_API_TOKEN: ${HETZNER_DNS_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # certs + keys — back this up!
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    # No depends_on the app: Caddy tolerates a down upstream via its active
    # health check, and the app color it should wait for changes per deploy.
    healthcheck:
      # Caddy's admin API (plaintext, always up while Caddy runs). Use the
      # IPv4 literal: Caddy binds admin on 127.0.0.1 only, but `localhost`
      # resolves to ::1 first in this image → connection refused. Probing
      # the public :80 instead would 308→https and then fail TLS (no cert
      # for the SNI).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Without these the first probe waits a full interval, so a recreated
      # caddy reads `starting` for 30s and the deploy's health gate calls it
      # unhealthy while it is already serving.
      start_period: 30s
      start_interval: 2s

  # Two interchangeable app replicas for zero-downtime cutover. Steady state
  # runs exactly one; a deploy boots the idle color, waits for its /readyz,
  # then stops the running one (graceful drain). Caddy fronts both and routes
  # only to whichever passes its health check. The body is defined once on
  # `uptimepage_blue` (the `&uptimepage_app` anchor) and merged into
  # `uptimepage_green` — both are byte-identical.
  uptimepage_blue: &uptimepage_app
    # Build from repo root by default; override with a pre-built image by setting
    # UPTIMEPAGE_IMAGE=ghcr.io/you/uptimepage:1.2.3 in .env.
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${UPTIMEPAGE_IMAGE:-uptimepage:latest}
    restart: unless-stopped
    logging: *logging
    # Must outlast the longest in-flight request, the check-now long poll at
    # ad_hoc_dispatch::RESULT_WAIT (30s), so SIGTERM drains it before SIGKILL.
    # The app drains via axum graceful shutdown; the default 10s grace would
    # truncate a slow request mid-cutover.
    stop_grace_period: 45s
    # No `ports:` — only reachable via the internal network.
    expose:
      - "8080"   # API + UI
      - "9090"   # Prometheus metrics (scrape on internal network only)
    environment:
      UPTIMEPAGE_STORAGE__POSTGRES__URL: postgres://monitor:${POSTGRES_PASSWORD}@postgres:5432/monitor
      UPTIMEPAGE_STORAGE__CLICKHOUSE__URL: http://clickhouse:8123
      UPTIMEPAGE_STORAGE__CLICKHOUSE__USER: default
      UPTIMEPAGE_STORAGE__CLICKHOUSE__PASSWORD: ${CLICKHOUSE_PASSWORD}
      UPTIMEPAGE_STORAGE__CLICKHOUSE__DATABASE: monitor
      # Probing topology. Default = all-in-one (this process probes its own
      # region). Set UPTIMEPAGE_SCHEDULER_ENABLED=false in .env to run as a pure
      # dashboard/brain and let a co-located `agent` service (profile below) probe
      # the region — then SCHEDULER_REGION is just the home region id new monitors
      # assign to. One knob: SCHEDULER_REGION feeds the agent's region too.
      UPTIMEPAGE_SCHEDULER__ENABLED: ${UPTIMEPAGE_SCHEDULER_ENABLED:-true}
      UPTIMEPAGE_SCHEDULER__REGION: ${UPTIMEPAGE_SCHEDULER_REGION:-default}
      UPTIMEPAGE_SCHEDULER__DEFAULT_REGION: ${UPTIMEPAGE_SCHEDULER_DEFAULT_REGION:-}
      UPTIMEPAGE_SECURITY__CREDENTIALS_KEK_BASE64: ${UPTIMEPAGE_CREDENTIALS_KEK_BASE64}
      UPTIMEPAGE_SECURITY__TRUSTED_PROXIES: ${UPTIMEPAGE_SECURITY__TRUSTED_PROXIES:-172.16.0.0/12,127.0.0.0/8,::1/128}
      # Disposable-email admission. "flag" (the image default) opens the
      # account and marks users.email_risk; "block" refuses it. Plumbed as an
      # env var so the decision can be flipped from the deploy workflow after
      # watching the flags, without cutting a release.
      UPTIMEPAGE_EMAIL_POLICY__ENABLED: ${UPTIMEPAGE_EMAIL_POLICY_ENABLED:-false}
      UPTIMEPAGE_EMAIL_POLICY__SIGNUP_POLICY: ${UPTIMEPAGE_EMAIL_POLICY_SIGNUP_POLICY:-flag}
      # Empty disables the /operator/* surface (routes 404).
      UPTIMEPAGE_OPERATOR__ADMIN_TOKEN: ${UPTIMEPAGE_OPERATOR_ADMIN_TOKEN:-}
      # Central Telegram bot (one-tap channel linking). Empty token = the
      # whole surface is absent; BYO telegram channels are unaffected.
      UPTIMEPAGE_TELEGRAM__BOT_TOKEN: ${UPTIMEPAGE_TELEGRAM_BOT_TOKEN:-}
      UPTIMEPAGE_TELEGRAM__BOT_USERNAME: ${UPTIMEPAGE_TELEGRAM_BOT_USERNAME:-}
      UPTIMEPAGE_TELEGRAM__WEBHOOK_SECRET: ${UPTIMEPAGE_TELEGRAM_WEBHOOK_SECRET:-}
      # Product mail. Provider "log" (the default) sends nothing; "resend"
      # needs the api key and the from address. Empty webhook secret = the
      # /hooks/resend bounce receiver is absent; empty support address = no
      # /help form.
      UPTIMEPAGE_EMAIL__PROVIDER: ${UPTIMEPAGE_EMAIL_PROVIDER:-log}
      UPTIMEPAGE_EMAIL__FROM_NAME: ${UPTIMEPAGE_EMAIL_FROM_NAME:-Uptimepage}
      UPTIMEPAGE_EMAIL__FROM_ADDRESS: ${UPTIMEPAGE_EMAIL_FROM_ADDRESS:-}
      UPTIMEPAGE_EMAIL__SUPPORT_ADDRESS: ${UPTIMEPAGE_EMAIL_SUPPORT_ADDRESS:-}
      UPTIMEPAGE_EMAIL__RESEND__API_KEY: ${UPTIMEPAGE_EMAIL_RESEND_API_KEY:-}
      UPTIMEPAGE_EMAIL__RESEND__WEBHOOK_SECRET: ${UPTIMEPAGE_EMAIL_RESEND_WEBHOOK_SECRET:-}
      # Operator WhatsApp number (one-tap whatsapp_app channels). The
      # enabled flag is a deliberate spend gate — creds alone stay off.
      UPTIMEPAGE_WHATSAPP_APP__ENABLED: ${UPTIMEPAGE_WHATSAPP_APP_ENABLED:-false}
      UPTIMEPAGE_WHATSAPP_APP__ACCESS_TOKEN: ${UPTIMEPAGE_WHATSAPP_APP_ACCESS_TOKEN:-}
      UPTIMEPAGE_WHATSAPP_APP__PHONE_NUMBER_ID: ${UPTIMEPAGE_WHATSAPP_APP_PHONE_NUMBER_ID:-}
      UPTIMEPAGE_WHATSAPP_APP__PUBLIC_NUMBER: ${UPTIMEPAGE_WHATSAPP_APP_PUBLIC_NUMBER:-}
      UPTIMEPAGE_WHATSAPP_APP__APP_SECRET: ${UPTIMEPAGE_WHATSAPP_APP_APP_SECRET:-}
      UPTIMEPAGE_WHATSAPP_APP__VERIFY_TOKEN: ${UPTIMEPAGE_WHATSAPP_APP_VERIFY_TOKEN:-}
      UPTIMEPAGE_WHATSAPP_APP__TEMPLATE_NAME: ${UPTIMEPAGE_WHATSAPP_APP_TEMPLATE_NAME:-}
      UPTIMEPAGE_WHATSAPP_APP__LANGUAGE_CODE: ${UPTIMEPAGE_WHATSAPP_APP_LANGUAGE_CODE:-en}
      # Operator OAuth apps ("Add to Slack" / "Add to Discord"). Empty =
      # button hidden; the manual webhook-paste kinds work either way.
      UPTIMEPAGE_SLACK_OAUTH__CLIENT_ID: ${UPTIMEPAGE_SLACK_OAUTH_CLIENT_ID:-}
      UPTIMEPAGE_SLACK_OAUTH__CLIENT_SECRET: ${UPTIMEPAGE_SLACK_OAUTH_CLIENT_SECRET:-}
      UPTIMEPAGE_DISCORD_OAUTH__CLIENT_ID: ${UPTIMEPAGE_DISCORD_OAUTH_CLIENT_ID:-}
      UPTIMEPAGE_DISCORD_OAUTH__CLIENT_SECRET: ${UPTIMEPAGE_DISCORD_OAUTH_CLIENT_SECRET:-}
      UPTIMEPAGE_OBSERVABILITY__LOG_FORMAT: json
      # Bind metrics on all interfaces *inside* the container so the
      # optional Alloy sidecar (a separate container) can scrape it over
      # the internal docker network. Still never published to the host:
      # there is no `ports:` mapping for 9090, only `expose`. /metrics
      # has no auth, so it must stay internal-only.
      UPTIMEPAGE_SERVER__METRICS_BIND: 0.0.0.0:9090
      # Optional in-app OTLP trace export to Grafana Cloud (or any OTLP
      # collector). Off unless all of these are set in .env. Distinct
      # from the Alloy metrics path above — traces go straight from the
      # app to the OTLP gateway. The API token is a secret (env only).
      UPTIMEPAGE_OBSERVABILITY__TRACING_ENABLED: ${UPTIMEPAGE_TRACING_ENABLED:-false}
      UPTIMEPAGE_OBSERVABILITY__GRAFANA__ENABLED: ${GRAFANA_OTLP_ENABLED:-false}
      UPTIMEPAGE_OBSERVABILITY__GRAFANA__OTLP_ENDPOINT: ${GRAFANA_OTLP_ENDPOINT:-}
      UPTIMEPAGE_OBSERVABILITY__GRAFANA__INSTANCE_ID: ${GRAFANA_OTLP_INSTANCE_ID:-}
      UPTIMEPAGE_OBSERVABILITY__GRAFANA__API_KEY: ${GRAFANA_OTLP_API_TOKEN:-}
      # External dead-man's-switch heartbeat. Off unless HEARTBEAT_URL is set
      # in .env; the URL holds a capability token (env only, never logged).
      UPTIMEPAGE_OBSERVABILITY__HEARTBEAT__ENABLED: ${HEARTBEAT_ENABLED:-false}
      UPTIMEPAGE_OBSERVABILITY__HEARTBEAT__URL: ${HEARTBEAT_URL:-}
      UPTIMEPAGE_OBSERVABILITY__HEARTBEAT__INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-60}
      # Public-status surface routing. `path_based` serves `/status/<slug>` on
      # the operator host. `subdomain` serves per-org pages on
      # `{slug}.{public_status.base_domain}` (apex wildcard). base_domain
      # reuses UPTIMEPAGE_DOMAIN so {slug}.{domain} resolves via the
      # Caddy apex wildcard; only consulted when SUBDOMAIN_PUBLIC_ROUTES is
      # true.
      UPTIMEPAGE_TENANCY__PATH_BASED_PUBLIC_ROUTES: ${UPTIMEPAGE_PATH_BASED_PUBLIC_ROUTES:-true}
      UPTIMEPAGE_TENANCY__SUBDOMAIN_PUBLIC_ROUTES: ${UPTIMEPAGE_SUBDOMAIN_PUBLIC_ROUTES:-false}
      UPTIMEPAGE_PUBLIC_STATUS__BASE_DOMAIN: ${UPTIMEPAGE_DOMAIN}
      # Session-fingerprint salt. REQUIRED — boot refuses to start with an
      # empty salt.
      UPTIMEPAGE_AUTH__FINGERPRINT_SALT: ${UPTIMEPAGE_AUTH_FINGERPRINT_SALT:-}
      # GitHub OAuth — the operator login method (the app owns auth; there is
      # no edge basic_auth). client_id is public; client_secret is a secret.
      # redirect_url must exactly match the OAuth App's callback URL;
      # public_base_url is the external origin used to build OAuth/redirect
      # and emailed links.
      UPTIMEPAGE_AUTH__GITHUB__CLIENT_ID: ${UPTIMEPAGE_AUTH_GITHUB_CLIENT_ID:-}
      UPTIMEPAGE_AUTH__GITHUB__CLIENT_SECRET: ${UPTIMEPAGE_AUTH_GITHUB_CLIENT_SECRET:-}
      UPTIMEPAGE_AUTH__GITHUB__REDIRECT_URL: ${UPTIMEPAGE_AUTH_GITHUB_REDIRECT_URL:-}
      # Google OAuth login — same contract as the GitHub trio above.
      UPTIMEPAGE_AUTH__GOOGLE__CLIENT_ID: ${UPTIMEPAGE_AUTH_GOOGLE_CLIENT_ID:-}
      UPTIMEPAGE_AUTH__GOOGLE__CLIENT_SECRET: ${UPTIMEPAGE_AUTH_GOOGLE_CLIENT_SECRET:-}
      UPTIMEPAGE_AUTH__GOOGLE__REDIRECT_URL: ${UPTIMEPAGE_AUTH_GOOGLE_REDIRECT_URL:-}
      # Microsoft OAuth login — same contract, plus the tenant the endpoints
      # are addressed to (defaults to "common": work, school and personal).
      UPTIMEPAGE_AUTH__MICROSOFT__CLIENT_ID: ${UPTIMEPAGE_AUTH_MICROSOFT_CLIENT_ID:-}
      UPTIMEPAGE_AUTH__MICROSOFT__CLIENT_SECRET: ${UPTIMEPAGE_AUTH_MICROSOFT_CLIENT_SECRET:-}
      UPTIMEPAGE_AUTH__MICROSOFT__REDIRECT_URL: ${UPTIMEPAGE_AUTH_MICROSOFT_REDIRECT_URL:-}
      UPTIMEPAGE_AUTH__MICROSOFT__TENANT: ${UPTIMEPAGE_AUTH_MICROSOFT_TENANT:-common}
      # GitLab OAuth login — same contract, plus the instance the app is
      # registered on (defaults to gitlab.com).
      UPTIMEPAGE_AUTH__GITLAB__CLIENT_ID: ${UPTIMEPAGE_AUTH_GITLAB_CLIENT_ID:-}
      UPTIMEPAGE_AUTH__GITLAB__CLIENT_SECRET: ${UPTIMEPAGE_AUTH_GITLAB_CLIENT_SECRET:-}
      UPTIMEPAGE_AUTH__GITLAB__REDIRECT_URL: ${UPTIMEPAGE_AUTH_GITLAB_REDIRECT_URL:-}
      UPTIMEPAGE_AUTH__GITLAB__BASE_URL: ${UPTIMEPAGE_AUTH_GITLAB_BASE_URL:-https://gitlab.com}
      UPTIMEPAGE_AUTH__PUBLIC_BASE_URL: ${UPTIMEPAGE_AUTH_PUBLIC_BASE_URL:-}
      # Marketing site (apex + www). Disabled by default — the binary
      # serves only the operator + tenant surfaces unless this is true.
      # RouteByHost dispatches `Marketing` hosts only when enabled here.
      UPTIMEPAGE_MARKETING__ENABLED: ${UPTIMEPAGE_MARKETING__ENABLED:-false}
      UPTIMEPAGE_MARKETING__APP_URL: ${UPTIMEPAGE_MARKETING__APP_URL:-}
      UPTIMEPAGE_MARKETING__CANONICAL_ORIGIN: ${UPTIMEPAGE_MARKETING__CANONICAL_ORIGIN:-}
      UPTIMEPAGE_MARKETING__BLOG_ENABLED: ${UPTIMEPAGE_MARKETING__BLOG_ENABLED:-false}
      # Read-only + write MCP server for LLM connectors. Deploy-managed:
      # deploy.yml upserts UPTIMEPAGE_MCP_ENABLED / _OAUTH_ENABLED from the repo
      # variables MCP_ENABLED / MCP_OAUTH_ENABLED (default off here when unset).
      # The OAuth resource id is the canonical /mcp URI on the `mcp` subdomain
      # (its own Caddy site block; the app serves only the transport and
      # discovery on that label). The
      # issuer is UPTIMEPAGE_AUTH_PUBLIC_BASE_URL above — which MUST be https
      # when OAuth is on, or the app refuses to boot.
      UPTIMEPAGE_MCP__ENABLED: ${UPTIMEPAGE_MCP_ENABLED:-false}
      UPTIMEPAGE_MCP__OAUTH_ENABLED: ${UPTIMEPAGE_MCP_OAUTH_ENABLED:-false}
      UPTIMEPAGE_MCP__RESOURCE_URI: ${UPTIMEPAGE_MCP_RESOURCE_URI:-https://mcp.${UPTIMEPAGE_DOMAIN}/mcp}
      # Effective trace/log filter. tracing reads RUST_LOG before the
      # config file, so this is the authoritative knob; it must be at
      # least `debug` for HTTP request spans (hence OTLP traces) to be
      # recorded. Deploy-managed: deploy.yml upserts RUST_LOG from the
      # repo variable, falling back to `debug` here when unset.
      RUST_LOG: ${RUST_LOG:-debug}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    # No container-level healthcheck: the runtime image is distroless
    # (no shell, no wget, no curl). Caddy probes /healthz actively via
    # `health_uri` in the reverse_proxy block — see Caddyfile.

  uptimepage_green:
    <<: *uptimepage_app

  # Co-located regional probe for the control plane's own region (the dashboard
  # itself probes nothing when UPTIMEPAGE_SCHEDULER_ENABLED=false). Pinned by
  # AGENT_IMAGE, moved only by the deploy-agent workflow, so a dashboard deploy
  # never restarts the region's probes; unset, it follows the dashboard image
  # (single-image self-host). Profile-gated (`--profile agent`) so
  # local/dev/self-host never start it; it runs only when HOME_AGENT_TOKEN is
  # provisioned in .env. Reaches the control plane over the public origin,
  # identical to a remote agent — no special internal networking. Region
  # defaults to SCHEDULER_REGION so the home region has one source of truth.
  agent:
    profiles: ["agent"]
    image: ${AGENT_IMAGE:-${UPTIMEPAGE_IMAGE:-uptimepage:latest}}
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    # Distroless ships no writable /tmp; the flow engine needs scratch space.
    tmpfs:
      - /tmp
    expose:
      - "9090"
    environment:
      UPTIMEPAGE_AGENT__ENABLED: "true"
      # Browser flow probing. Off unless AGENT_FLOW_ENABLED=true in .env, so only
      # the region wired for it runs flows; the engine ships in every image.
      UPTIMEPAGE_FLOW__ENABLED: ${AGENT_FLOW_ENABLED:-false}
      UPTIMEPAGE_FLOW__LIGHTPANDA_PATH: /usr/local/bin/lightpanda
      # Bind metrics on all interfaces (default is loopback) so the Alloy
      # sidecar can scrape the agent's probe-side metrics over the network.
      UPTIMEPAGE_SERVER__METRICS_BIND: 0.0.0.0:9090
      # Defaults to this deployment's own dashboard origin (derived from
      # UPTIMEPAGE_DOMAIN, like MCP_RESOURCE_URI above) so a self-host never
      # silently probes someone else's control plane. Override only for a
      # non-standard origin (e.g. an internal address to skip the public hop).
      UPTIMEPAGE_AGENT__CONTROL_PLANE_URL: ${AGENT_CONTROL_PLANE_URL:-https://app.${UPTIMEPAGE_DOMAIN}}
      UPTIMEPAGE_AGENT__TOKEN: ${HOME_AGENT_TOKEN}
      UPTIMEPAGE_AGENT__REGION: ${UPTIMEPAGE_SCHEDULER_REGION:-default}
      UPTIMEPAGE_OBSERVABILITY__LOG_FORMAT: json
      RUST_LOG: ${RUST_LOG:-info,uptimepage=info}

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    expose:
      - "5432"
    # Tuning overrides; PGDATA still supplies the data directory.
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: monitor
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    restart: unless-stopped
    logging: *logging
    expose:
      - "8123"   # HTTP
      - "9000"   # native protocol
      - "9363"   # Prometheus metrics (internal scrape only)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: monitor
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Constrain RAM — see ./clickhouse-config.xml
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      # Authoritative `default` password from CLICKHOUSE_PASSWORD on
      # every boot — works around first-init-only seeding (see the
      # file header for the full rationale). `zz-` sorts last in
      # users.d so it overrides any entrypoint-seeded user.
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.d/zz-default-password.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: ship metrics to Grafana Cloud via a Grafana Alloy sidecar.
  # Off by default — only starts under the "metrics" profile:
  #   docker compose --profile metrics up -d
  # Requires GRAFANA_CLOUD_PROM_URL / _PROM_USER / _API_TOKEN in .env.
  # Scrapes uptimepage:9090 on the internal network and remote-writes
  # to Grafana Cloud; nothing new is exposed to the host.
  alloy:
    # Pinned for reproducible production deploys; bump deliberately.
    image: grafana/alloy:v1.16.1
    restart: unless-stopped
    logging: *logging
    profiles: ["metrics"]
    command:
      - run
      - --disable-reporting
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN}
      # Loki log shipping (optional). Empty default → config.alloy
      # resolves an unreachable placeholder and the logs pipeline stays
      # inert; metrics are unaffected. Token is reused from above.
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      # Distinguishes this sender in Grafana Cloud; set per host if you
      # run more than one so series don't collide.
      GRAFANA_CLOUD_INSTANCE: ${GRAFANA_CLOUD_INSTANCE:-uptimepage}
      # Region label stamped on the home agent's scraped series so dashboards
      # can filter probe metrics by region. Mirrors the agent's own region.
      UPTIMEPAGE_AGENT_REGION: ${UPTIMEPAGE_SCHEDULER_REGION:-default}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # Read-only Docker socket: container discovery for loki.source.docker
      # (logs pipeline). SECURITY: `:ro` does NOT restrict the Docker API —
      # socket access is effectively host-root. Accepted here (single
      # operator-controlled box, pinned upstream Alloy image, metrics
      # profile only). Rationale in runbooks/grafana-cloud.md.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No depends_on the app: Alloy scrapes/tails over the network and must
    # survive either color being the one that's down.

  # Host metrics for Grafana Cloud. A full disk once stalled ClickHouse writes
  # with no early signal; node_filesystem_avail_bytes feeds the disk-space
  # alerts. Filesystem, memory, and CPU collectors only (disable-defaults keeps
  # the rest off) so ingest stays small; the filesystem collector also carries
  # inode metrics. Reads the host rootfs read-only. Metrics profile, like alloy;
  # internal port, not published.
  node-exporter:
    image: prom/node-exporter:v1.11.1
    restart: unless-stopped
    logging: *logging
    profiles: ["metrics"]
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.meminfo
      - --collector.cpu
    volumes:
      - /proc:/host/proc:ro
      - /:/rootfs:ro
    expose:
      - "9100"

networks:
  default:
    # Without v6 here docker-proxy SNATs every inbound IPv6 client to the bridge
    # gateway, collapsing the per-IP rate limits onto one address. Also the
    # probe's v6 egress. ULA global id is random per RFC 4193 3.2.2.
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd4f:420f:fd92::/64

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  postgres_data:
  clickhouse_data:
  alloy_data:
