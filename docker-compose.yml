# Try-it and local development. Not safe to expose: nothing terminates TLS,
# /metrics on 9090 has no auth at any layer, and both databases are published
# with the dev credentials. For production (TLS, internal-only databases,
# per-IP rate limits), see ./deployment/.
#
# Pulls the published image. To build from this checkout instead:
#   docker compose -f docker-compose.yml -f compose.build.yml up -d --build
name: uptimepage
x-app-image: &app-image ${UPTIMEPAGE_IMAGE:-ghcr.io/uptimepage/uptimepage:latest}
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: monitor
      CLICKHOUSE_USER: monitor
      CLICKHOUSE_PASSWORD: monitor
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
    configs:
      - source: clickhouse_quiet
        target: /etc/clickhouse-server/config.d/quiet.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "monitor", "--password", "monitor", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  uptimepage:
    image: *app-image
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      UPTIMEPAGE_STORAGE__POSTGRES__URL: postgres://monitor:monitor@postgres:5432/monitor
      UPTIMEPAGE_STORAGE__CLICKHOUSE__URL: http://clickhouse:8123
      UPTIMEPAGE_STORAGE__CLICKHOUSE__USER: monitor
      UPTIMEPAGE_STORAGE__CLICKHOUSE__PASSWORD: monitor
      UPTIMEPAGE_STORAGE__ALLOW_DEFAULT_CREDENTIALS: "true"
      UPTIMEPAGE_AUTH__FINGERPRINT_SALT: dev-only-fingerprint-salt-change-me
      UPTIMEPAGE_AUTH__SESSION__COOKIE_SECURE: "false"
      UPTIMEPAGE_OBSERVABILITY__LOG_FORMAT: json
      UPTIMEPAGE_OBSERVABILITY__LOG_LEVEL: "uptimepage=debug,sqlx=warn,hyper=warn,tower_http=info,info"
    ports:
      - "8080:8080"
      - "9090:9090"

  # Mock-server + client live in the same process; nothing external is needed.
  # Linux container exposes the kernel knobs macOS loopback can't (ephemeral
  # range, somaxconn, tw_reuse), unlocking the 50k-concurrent target.
  # Run: docker compose --profile loadtest run --rm loadtest
  loadtest:
    profiles: ["loadtest"]
    image: *app-image
    entrypoint: ["/usr/local/bin/loadtest"]
    environment:
      CONCURRENCY: "50000"
      DURATION_SECS: "300"
      TIMEOUT_MS: "5000"
      MOCK_PORTS: "16"
      RAMP_SECS: "10"
      HTTP2: "1"
      RUST_LOG: "info"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      net.core.somaxconn: "8192"
      net.ipv4.tcp_tw_reuse: "1"
      net.ipv4.ip_local_port_range: "10000 65535"
      net.ipv4.tcp_fin_timeout: "15"

volumes:
  pg_data:
  ch_data:

configs:
  clickhouse_quiet:
    file: ./config/clickhouse-quiet.xml
