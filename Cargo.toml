[package]
name = "uptimepage"
version = "1.3.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
publish = false
default-run = "uptimepage"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# Headless CDP client for browser-driven flow monitors (drives a Lightpanda
# engine over the Chrome DevTools Protocol). Pinned to the version validated
# end-to-end against Lightpanda.
chromiumoxide = "0.9"

# HTTP client (custom hyper-util stack for connect/tls timing + pool gauges)
hyper = { version = "1.9", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http-body = "1"
bytes = "1"
flate2 = "1"
brotli = "8"
socket2 = "0.6"
base64 = "0.22"
aes-gcm = "0.10"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "rustls-native-certs", "webpki-tokio"] }

# TLS
rustls = "0.23"
rustls-native-certs = "0.8"
webpki-roots = "1.0"
tokio-rustls = "0.26"

# DNS (custom caching resolver)
hickory-resolver = { version = "0.26", features = ["tls-ring", "tokio"] }

# ICMP echo probes (shared async socket, DGRAM-first for unprivileged runs)
surge-ping = "0.9"

# Storage
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }

# ClickHouse for time-series results (optional but recommended)
clickhouse = { version = "0.15", features = ["rustls-tls", "uuid", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# tracing-opentelemetry 0.32 bridges the opentelemetry 0.31 line — the
# otel crates MUST stay on 0.31 to match it (0.32 otel breaks the
# SdkTracer: Tracer impl the layer needs).
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
# OTLP/HTTP protobuf exporter only (reqwest + rustls). No tonic/gRPC.
# Blocking reqwest client, NOT the async one: opentelemetry_sdk 0.31's
# BatchSpanProcessor exports from a dedicated non-Tokio thread, so the
# async client panics there ("no reactor running"). The blocking client
# does sync HTTP on that thread — the pairing the SDK 0.31 expects.
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client", "reqwest-rustls"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Web framework for API + metrics endpoint
axum = { version = "0.8.9", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "compression-br", "cors", "fs", "set-header"] }
tower-cookies = "0.11"

# Server-rendered web UI (askama templates + askama_web axum bridge)
askama = { version = "0.16", features = ["serde_json"] }
askama_web = { version = "0.16", features = ["axum-0.8"] }

# Embed static assets into the release binary
rust-embed = { version = "8.11", features = ["axum"] }
mime_guess = "2"

# Public-page `public_about`: parse markdown, then sanitise the HTML. The
# parser output is never trusted — every byte passes through the ammonia
# allowlist before it reaches a template.
pulldown-cmark = { version = "0.13.3", default-features = false, features = ["html"] }
ammonia = "4.1.2"
# Code-fence highlighting, emitted as CSS classes rather than inline styles:
# the marketing CSP is `style-src 'self'`. fancy-regex keeps the build pure
# Rust; two-face carries the syntaxes syntect ships without (TOML, Terraform).
syntect = { version = "5.3", default-features = false, features = ["parsing", "html", "regex-fancy", "dump-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# Marketing blog content compiled into the binary at build time.
include_dir = "0.7"

# Utilities
uuid = { version = "1.23", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
config = "0.15"
dashmap = "6.1"
parking_lot = "0.12"
governor = "0.10"
backoff = { version = "0.4", features = ["tokio"] }
url = { version = "2.5", features = ["serde"] }
idna = "1.1"
psl = "2.1"
# Anti-abuse: compiled URL-pattern deny-list + YAML domain deny-list loader.
regex = "1"
serde_norway = "0.9"
async-trait = "0.1"
fastrand = "2"
moka = { version = "0.12", features = ["future"] }
arc-swap = "1"
lettre = { version = "0.11.21", default-features = false, features = ["smtp-transport", "builder", "pool", "tokio1-rustls-tls"] }
x509-parser = "0.18.1"

# Secret-string wrapper for in-memory API keys / OAuth client secrets.
secrecy = { version = "0.10", features = ["serde"] }

# Auth crypto: SHA-256 for fingerprint hashing (IP / user-agent / session-id
# salting), OsRng-backed random for session ids + OAuth state.
sha2 = "0.11.0-rc.3"
# HMAC-SHA256 for signing outbound webhook payloads (shares sha2's digest 0.11).
hmac = "0.13.0"
# Lowercase-hex encoding (asset fingerprints, content hashes).
hex = "0.4.3"
rand = "0.10"
# Constant-time byte comparison for secret material (OAuth state, magic-link
# tokens, invitation tokens — see §7.3).
subtle = "2.6"
# Argon2id password hashing for API tokens (§4.4) and invitation/magic-link
# token verification.
argon2 = "0.6.0-rc.8"

# Passkeys. `danger-allow-state-serialisation` is what lets a ceremony's state
# live in Postgres between the two round trips; the name is a warning that the
# row must be single-use and expiring, which `webauthn_states` enforces.
# `conditional-ui` carries the discoverable login that keeps the sign-in page
# from having to be told an address first.
# Pinned exactly, and to a prerelease on purpose: 0.5 is the newest stable and
# hard-depends on openssl, which the musl builder has no headers for and which
# would put a second C crypto stack beside ring. 0.6 verifies with RustCrypto
# instead. Exact so a later -dev publish cannot move the login path on its own.
#
# `attestation` stays off with the default features: it pulls openssl back in
# through webauthn-attestation-ca, and a passkey is trusted because the user
# holds it, not because a CA vouches for the authenticator model.
webauthn-rs = { version = "=0.6.1-dev", default-features = false, features = [
    "danger-allow-state-serialisation",
    "conditional-ui",
    "resident-key-support",
] }

# OpenAPI schema derivation
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid", "url"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
ipnet = { version = "2.12.0", features = ["serde"] }
chrono-tz = { version = "0.10.4", default-features = false }

# Model Context Protocol server (read tools at /mcp). Streamable HTTP transport
# mounts as a tower::Service on the existing axum router. Server-only: client +
# reqwest features excluded so we don't pull a second HTTP/TLS stack.
rmcp = { version = "1.7", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "elicitation",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }
schemars = "1"

[build-dependencies]
# build.rs parses esbuild's metafile to emit the asset manifest.
serde_json = "1.0"

[dev-dependencies]
# test-util unlocks tokio::time pause for the send-budget timing tests.
tokio = { version = "1.52", features = ["full", "test-util"] }
criterion = { version = "0.8", features = ["async_tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rcgen = "0.14"
rustls-pemfile = "2"
tokio-rustls = "0.26"
time = "0.3.47"
# Strict XML parser for the RSS 2.0 well-formedness check.
quick-xml = "0.41"
# Fixture-based parameterization for self-host vs SaaS test matrices.
rstest = { version = "0.26", default-features = false }
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-debug]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "circuit_breaker"
harness = false

[[bench]]
name = "batcher_flush"
harness = false

[[bench]]
name = "http_client"
harness = false

[[bench]]
name = "public_status_ttfb"
harness = false

[[bench]]
name = "public_status_concurrent"
harness = false
